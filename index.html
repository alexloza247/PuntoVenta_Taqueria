/* ================= Comandas ================= */
function updateHomeComandas() {
  const n = comandas.filter(c => c.status === 'activa').length;
  document.getElementById('homeComandasCount').textContent = n ? '(' + n + ' activa' + (n > 1 ? 's' : '') + ')' : '';
}
function comandaCard(c, isActiva) {
  const card = document.createElement('div');
  card.className = 'comanda-card';
  let itemsHtml = c.items.map(i => '<div class="c-item"><span>' + i.qty + '× ' + i.name + (i.nota ? ' — ' + escapeHtml(i.nota) : '') + '</span><span>' + fmt(i.subtotal) + '</span></div>').join('');
  const clienteHtml = c.cliente ? '<div class="c-cliente">Cliente: ' + escapeHtml(c.cliente) + '</div>' : '';
  const detallesHtml = c.detalles ? '<div class="c-detalles">Detalles: ' + escapeHtml(c.detalles) + '</div>' : '';
  card.innerHTML = '<div class="c-head"><span>Comanda #' + c.id + '</span><span class="c-time">' + fmtDateTime(c.datetime) + '</span></div>' +
    clienteHtml + detallesHtml + itemsHtml + '<div class="c-total">' + fmt(c.total) + '</div>';
  const btns = document.createElement('div');
  btns.className = 'c-btns';
  if (isActiva) {
    const bEnt = document.createElement('button');
    bEnt.className = 'c-btn deliver';
    bEnt.textContent = 'Entregada';
    bEnt.addEventListener('click', () => {
      c.status = 'completada';
      save(LS_COMANDAS, comandas);
      renderComandas(); updateHomeComandas();
      toast('Comanda #' + c.id + ' entregada');
    });
    btns.appendChild(bEnt);
  }
  const bPay = document.createElement('button');
  bPay.className = 'c-btn pay';
  bPay.textContent = 'Pagada';
  bPay.addEventListener('click', () => openComandaPay(c));
  btns.appendChild(bPay);
  card.appendChild(btns);
  return card;
}
function renderComandas() {
  const actBox = document.getElementById('comandasActivas');
  const compBox = document.getElementById('comandasCompletadas');
  const act = comandas.filter(c => c.status === 'activa');
  const comp = comandas.filter(c => c.status === 'completada');
  actBox.innerHTML = act.length ? '' : '<div class="empty-state">No hay comandas activas</div>';
  compBox.innerHTML = comp.length ? '' : '<div class="empty-state">No hay comandas completadas</div>';
  act.forEach(c => actBox.appendChild(comandaCard(c, true)));
  comp.forEach(c => compBox.appendChild(comandaCard(c, false)));
}

/* ================= Configuración ================= */
let configDraft = null;      // copia de trabajo del catálogo (se aplica al guardar)
let configRowByPid = new Map();
const CFG_PALETTE = ['#1e5631', '#276749', '#2f855a', '#38a169', '#43a047', '#558b2f', '#2e7d32', '#33691e'];
let cfgNewSeq = 0;

function cfgFindProduct(pid) {
  for (const cat of configDraft) for (const sec of cat.sections) for (const p of sec.items) if (p.id === pid) return p;
  return null;
}
function cfgNewId() {
  let id;
  do { id = 'nuevo-' + Date.now().toString(36) + '-' + (++cfgNewSeq); } while (cfgFindProduct(id));
  return id;
}
function autoGrowCfgName(el) {
  el.style.height = 'auto';
  el.style.height = Math.max(el.scrollHeight, 24) + 'px';
}
function openConfig() {
  configDraft = JSON.parse(JSON.stringify(catalog));
  renderConfig();
  showConfigTab(configTab);
}
function showConfigTab(tab) {
  configTab = (tab === 'dispositivos' || tab === 'general') ? tab : 'productos';
  save(LS_CONFIG_TAB, configTab);
  document.getElementById('tabConfigProductos').classList.toggle('active', configTab === 'productos');
  document.getElementById('tabConfigDispositivos').classList.toggle('active', configTab === 'dispositivos');
  document.getElementById('tabConfigGeneral').classList.toggle('active', configTab === 'general');
  document.getElementById('configBody').classList.toggle('hidden', configTab !== 'productos');
  document.getElementById('configFoot').classList.toggle('hidden', configTab !== 'productos');
  document.getElementById('devicesBody').classList.toggle('hidden', configTab !== 'dispositivos');
  document.getElementById('generalBody').classList.toggle('hidden', configTab !== 'general');
  if (configTab === 'dispositivos') renderDevices();
  if (configTab === 'general') renderGeneral();
}
document.getElementById('tabConfigProductos').addEventListener('click', () => showConfigTab('productos'));
document.getElementById('tabConfigDispositivos').addEventListener('click', () => showConfigTab('dispositivos'));
document.getElementById('tabConfigGeneral').addEventListener('click', () => showConfigTab('general'));

/* ================= General (pestaña de Configuración) ================= */
function nombreHtml(name) {
  const m = String(name).match(/^(.*?)(\s*("[^"]*"|'[^']*'))\s*$/);
  if (m && m[1].trim()) return escapeHtml(m[1].trim()) + ' <span>' + escapeHtml(m[3]) + '</span>';
  return escapeHtml(name);
}
function applyNombreSucursal() {
  const ht = document.getElementById('homeTitle');
  if (ht) ht.innerHTML = nombreHtml(nombreSucursal);
  const pb = document.getElementById('posBrand');
  if (pb) pb.innerHTML = 'Punto de venta - ' + nombreHtml(nombreSucursal);
  const logo = document.getElementById('homeLogo');
  if (logo) logo.alt = nombreSucursal;
  document.title = 'Punto de venta - ' + nombreSucursal;
}
function renderGeneral() {
  const body = document.getElementById('generalBody');
  body.innerHTML = '';
  const sec = document.createElement('div');
  sec.className = 'dev-section';
  const h = document.createElement('h3');
  h.textContent = 'General';
  sec.appendChild(h);
  const f = document.createElement('div');
  f.className = 'printer-field';
  const lbl = document.createElement('label');
  lbl.textContent = 'Nombre de la sucursal';
  f.appendChild(lbl);
  const inp = document.createElement('input');
  inp.type = 'text';
  inp.value = nombreSucursal;
  inp.placeholder = "Taquería 'El Vergel'";
  inp.maxLength = 80;
  f.appendChild(inp);
  sec.appendChild(f);
  const btnSave = document.createElement('button');
  btnSave.className = 'btn-print-test';
  btnSave.textContent = 'Guardar';
  btnSave.addEventListener('click', () => {
    const v = inp.value.trim();
    if (!v) { inp.value = nombreSucursal; toast('El nombre no puede estar vacío'); return; }
    nombreSucursal = v;
    save(LS_NOMBRE, nombreSucursal);
    applyNombreSucursal();
    toast('Nombre actualizado');
  });
  sec.appendChild(btnSave);
  const note = document.createElement('div');
  note.className = 'dev-note';
  note.textContent = 'Más opciones próximamente';
  sec.appendChild(note);
  body.appendChild(sec);
}

/* ================= Dispositivos (pestaña de Configuración) ================= */
const DEVICE_TYPES = ['Caja', 'Computadora', 'Tablet', 'Celular', 'Otro'];
const DEVICE_PERMS = [
  { key: 'pos', label: 'Punto de venta' },
  { key: 'comandas', label: 'Comandas' },
  { key: 'cobrar', label: 'Cobrar' },
  { key: 'cortes', label: 'Cortes de caja' },
  { key: 'ventas', label: 'Ventas' },
  { key: 'configuracion', label: 'Configuración' }
];
function savePrinter() { save(LS_PRINTER, printerSettings); }
function saveDevices() { save(LS_DEVICES, devices); }

function renderDevices() {
  const body = document.getElementById('devicesBody');
  body.innerHTML = '';

  /* --- Impresora de tickets --- */
  const secP = document.createElement('div');
  secP.className = 'dev-section';
  const hP = document.createElement('h3');
  hP.textContent = 'Impresora de tickets';
  secP.appendChild(hP);

  const btnConectar = document.createElement('button');
  btnConectar.type = 'button';
  btnConectar.className = 'btn-conectar-impresora';
  btnConectar.textContent = 'Buscar impresora';
  secP.appendChild(btnConectar);

  const printerStatus = document.createElement('div');
  printerStatus.className = 'printer-status';
  secP.appendChild(printerStatus);

  const printerHint = document.createElement('div');
  printerHint.className = 'printer-hint';
  printerHint.textContent = 'Conecta una impresora para habilitar estas opciones.';
  secP.appendChild(printerHint);

  const fNombre = document.createElement('div');
  fNombre.className = 'printer-field';
  const lblNombre = document.createElement('label');
  lblNombre.textContent = 'Nombre de la impresora';
  fNombre.appendChild(lblNombre);
  const nombreDisplay = document.createElement('div');
  nombreDisplay.className = 'printer-name-display';
  function renderPrinterNameDisplay() {
    const n = printerSettings.nombre && String(printerSettings.nombre).trim();
    nombreDisplay.textContent = n || 'Sin impresora conectada';
    nombreDisplay.classList.toggle('printer-name-empty', !n);
  }
  renderPrinterNameDisplay();
  fNombre.appendChild(nombreDisplay);
  secP.appendChild(fNombre);

  const fAncho = document.createElement('div');
  fAncho.className = 'printer-field';
  const lblAncho = document.createElement('label');
  lblAncho.textContent = 'Ancho de papel';
  fAncho.appendChild(lblAncho);
  const selAncho = document.createElement('select');
  [58, 80].forEach(mm => {
    const o = document.createElement('option');
    o.value = String(mm);
    o.textContent = mm + ' mm';
    if (Number(printerSettings.ancho) === mm) o.selected = true;
    selAncho.appendChild(o);
  });
  selAncho.addEventListener('change', () => { printerSettings.ancho = Number(selAncho.value); savePrinter(); });
  fAncho.appendChild(selAncho);
  secP.appendChild(fAncho);

  const lblAuto = document.createElement('label');
  lblAuto.className = 'printer-toggle';
  const chkAuto = document.createElement('input');
  chkAuto.type = 'checkbox';
  chkAuto.checked = !!printerSettings.autoPrint;
  chkAuto.addEventListener('change', () => { printerSettings.autoPrint = chkAuto.checked; savePrinter(); });
  lblAuto.appendChild(chkAuto);
  lblAuto.appendChild(document.createTextNode('Imprimir ticket automáticamente al cobrar'));
  secP.appendChild(lblAuto);

  const btnTest = document.createElement('button');
  btnTest.className = 'btn-print-test';
  btnTest.textContent = 'Imprimir ticket de prueba';
  btnTest.addEventListener('click', () => printSampleTicket());
  secP.appendChild(btnTest);

  function refreshPrinterControls(msg, isFallback) {
    const hasPrinter = !!(printerSettings.nombre && String(printerSettings.nombre).trim());
    selAncho.disabled = !hasPrinter;
    chkAuto.disabled = !hasPrinter;
    btnTest.disabled = !hasPrinter;
    lblAuto.style.opacity = hasPrinter ? '' : '.45';
    printerHint.style.display = hasPrinter ? 'none' : '';
    if (msg !== undefined) {
      printerStatus.textContent = msg;
      printerStatus.classList.toggle('printer-fallback', !!isFallback);
    } else if (hasPrinter) {
      printerStatus.textContent = 'Impresora conectada: ' + printerSettings.nombre;
      printerStatus.classList.remove('printer-fallback');
    } else {
      printerStatus.textContent = '';
      printerStatus.classList.remove('printer-fallback');
    }
  }

  function applyPrinterName(name, fuente) {
    printerSettings.nombre = name;
    printerSettings.fuente = fuente;
    savePrinter();
    renderPrinterNameDisplay();
    refreshPrinterControls();
  }

  async function autoDetectPrinter() {
    try {
      const bt = navigator.bluetooth;
      if (!bt || typeof bt.getDevices !== 'function') return;
      const devs = await bt.getDevices();
      const dev = (devs || []).find(d => d && d.name && String(d.name).trim());
      if (!dev) return;
      const name = String(dev.name).trim();
      if (printerSettings.nombre === name && printerSettings.fuente === 'bluetooth') return;
      applyPrinterName(name, 'bluetooth');
    } catch (e) { /* silencioso: sin impresora previa o sin permiso */ }
  }

  async function connectPrinter() {
    const bt = navigator.bluetooth;
    if (bt && typeof bt.requestDevice === 'function') {
      try {
        const device = await bt.requestDevice({
          acceptAllDevices: true,
          optionalServices: ['battery_service', 'device_information', 'generic_access', 'generic_attribute', 'serial_port']
        });
        const name = device && device.name ? String(device.name).trim() : '';
        if (!name) return; // sin nombre: conservar valor anterior, sin mensaje
        applyPrinterName(name, 'bluetooth');
      } catch (e) {
        return; // cancelación / permiso denegado / no encontrado: conservar valor, sin mensaje
      }
      return;
    }
    const usb = navigator.usb;
    if (usb && typeof usb.requestDevice === 'function') {
      try {
        const device = await usb.requestDevice({ filters: [] });
        const name = device && (device.productName || device.manufacturerName) ? String(device.productName || device.manufacturerName).trim() : '';
        if (!name) return; // sin nombre: conservar valor anterior, sin mensaje
        applyPrinterName(name, 'usb');
      } catch (e) {
        return; // cancelación / permiso denegado: conservar valor, sin mensaje
      }
      return;
    }
    refreshPrinterControls('Tu navegador no permite detectar la impresora automáticamente. Usa Chrome o Edge para conectarla.', true);
  }

  btnConectar.addEventListener('click', connectPrinter);
  refreshPrinterControls();
  autoDetectPrinter();

  body.appendChild(secP);

  /* --- Dispositivos conectados --- */
  const secD = document.createElement('div');
  secD.className = 'dev-section';
  const hD = document.createElement('h3');
  hD.textContent = 'Dispositivos conectados';
  secD.appendChild(hD);

  devices.forEach(dev => {
    const card = document.createElement('div');
    card.className = 'dev-card';
    const inpName = document.createElement('input');
    inpName.type = 'text';
    inpName.className = 'dev-name';
    inpName.placeholder = 'Nombre del dispositivo';
    inpName.value = dev.nombre || '';
    inpName.addEventListener('input', () => { dev.nombre = inpName.value; saveDevices(); });
    card.appendChild(inpName);
    const selTipo = document.createElement('select');
    selTipo.className = 'dev-type';
    DEVICE_TYPES.forEach(t => {
      const o = document.createElement('option');
      o.value = t; o.textContent = t;
      if (dev.tipo === t) o.selected = true;
      selTipo.appendChild(o);
    });
    selTipo.addEventListener('change', () => { dev.tipo = selTipo.value; saveDevices(); });
    card.appendChild(selTipo);
    const perms = document.createElement('div');
    perms.className = 'dev-perms';
    DEVICE_PERMS.forEach(p => {
      const lbl = document.createElement('label');
      const chk = document.createElement('input');
      chk.type = 'checkbox';
      chk.checked = !!(dev.permisos && dev.permisos[p.key]);
      chk.addEventListener('change', () => {
        if (!dev.permisos) dev.permisos = {};
        dev.permisos[p.key] = chk.checked;
        saveDevices();
      });
      lbl.appendChild(chk);
      lbl.appendChild(document.createTextNode(p.label));
      perms.appendChild(lbl);
    });
    card.appendChild(perms);
    const btnDel = document.createElement('button');
    btnDel.className = 'dev-del';
    btnDel.textContent = 'Eliminar dispositivo';
    btnDel.addEventListener('click', () => {
      if (!confirm('¿Eliminar "' + (String(dev.nombre || '').trim() || 'este dispositivo') + '"?')) return;
      devices = devices.filter(x => x.id !== dev.id);
      saveDevices();
      renderDevices();
    });
    card.appendChild(btnDel);
    secD.appendChild(card);
  });

  const btnAdd = document.createElement('button');
  btnAdd.className = 'dev-add';
  btnAdd.textContent = '＋ Agregar dispositivo';
  btnAdd.addEventListener('click', () => {
    devices.push({ id: 'dev-' + Date.now().toString(36) + '-' + devices.length, nombre: '', tipo: 'Otro', permisos: { pos: false, comandas: false, cobrar: false, cortes: false, ventas: false, configuracion: false } });
    saveDevices();
    renderDevices();
    const cards = document.querySelectorAll('#devicesBody .dev-card');
    const last = cards.length ? cards[cards.length - 1].querySelector('.dev-name') : null;
    if (last && last.focus) last.focus();
  });
  secD.appendChild(btnAdd);

  const note = document.createElement('div');
  note.className = 'dev-note';
  note.textContent = 'Los dispositivos y permisos se guardan en este dispositivo. La sincronización entre dispositivos llegará después.';
  secD.appendChild(note);
  body.appendChild(secD);
}

/* ================= Impresión de tickets ================= */
function buildPrintTicketHtml(sale, esPrueba) {
  const items = sale.items.map(i => '<div class="pt-row"><span>' + i.qty + 'x ' + escapeHtml(i.name) + '</span><span>' + fmt(i.subtotal) + '</span></div>').join('');
  return '<div class="pt-head"><div class="pt-title">' + escapeHtml(nombreSucursal) + '</div>' +
    (printerSettings.nombre ? '<div class="pt-sub">' + escapeHtml(printerSettings.nombre) + '</div>' : '') +
    '<div class="pt-sub">' + (esPrueba ? 'Ticket de prueba' : fmtDateTime(sale.datetime)) + '</div></div>' +
    '<div class="pt-line"></div>' + items + '<div class="pt-line"></div>' +
    '<div class="pt-row pt-total"><span>Total</span><span>' + fmt(sale.total) + '</span></div>' +
    '<div class="pt-row"><span>Recibido</span><span>' + fmt(sale.received) + '</span></div>' +
    '<div class="pt-row"><span>Cambio</span><span>' + fmt(sale.change) + '</span></div>' +
    '<div class="pt-foot">Gracias por su preferencia</div>';
}
function printTicketHtml(htmlStr) {
  const el = document.getElementById('printTicket');
  el.style.width = (Number(printerSettings.ancho) === 58 ? '58mm' : '80mm');
  el.innerHTML = htmlStr;
  if (typeof window.print === 'function') window.print();
}
function printSampleTicket() {
  printTicketHtml(buildPrintTicketHtml({
    datetime: nowISO(),
    items: [
      { name: 'Orden de suadero', qty: 2, subtotal: 260 },
      { name: 'Coca Cola', qty: 1, subtotal: 30 }
    ],
    total: 290, received: 300, change: 10
  }, true));
}
function renderConfig() {
  configRowByPid = new Map();
  const body = document.getElementById('configBody');
  body.innerHTML = '';
  configDraft.forEach(cat => {
    const h = document.createElement('h2');
    h.textContent = cat.label;
    body.appendChild(h);
    cat.sections.forEach(sec => {
      if (sec.label) {
        const h3 = document.createElement('h3');
        h3.textContent = sec.label;
        body.appendChild(h3);
      }
      const grid = document.createElement('div');
      grid.className = 'cfg-grid';
      sec.items.forEach(p => {
        const box = document.createElement('div');
        box.className = 'cfg-box';
        box.style.background = p.color || CFG_PALETTE[0];
        const delBtn = document.createElement('button');
        delBtn.className = 'cfg-del';
        delBtn.textContent = '×';
        delBtn.dataset.pid = p.id;
        delBtn.addEventListener('click', () => {
          const prod = cfgFindProduct(p.id);
          const nm = prod ? (String(prod.name || '').trim() || p.name) : p.name;
          if (!confirm('¿Eliminar "' + nm + '"?')) return;
          for (const sec2 of cat.sections) sec2.items = sec2.items.filter(x => x.id !== p.id);
          renderConfig();
        });
        const nameIn = document.createElement('textarea');
        nameIn.rows = 1;
        nameIn.className = 'cfg-name';
        nameIn.value = p.name;
        nameIn.placeholder = 'Nombre';
        nameIn.dataset.pid = p.id;
        nameIn.dataset.field = 'name';
        nameIn.addEventListener('input', () => {
          nameIn.value = nameIn.value.replace(/[\r\n]+/g, ' ');
          const prod = cfgFindProduct(p.id);
          if (prod) prod.name = nameIn.value;
          box.classList.remove('invalid');
          autoGrowCfgName(nameIn);
        });
        const priceWrap = document.createElement('span');
        priceWrap.className = 'cfg-price';
        const cur = document.createElement('span');
        cur.className = 'cur';
        cur.textContent = '$';
        const priceIn = document.createElement('input');
        priceIn.type = 'number';
        priceIn.className = 'cfg-price-in';
        priceIn.min = '0';
        priceIn.step = '0.01';
        priceIn.value = (p.price === '' || p.price == null) ? '' : p.price;
        priceIn.dataset.pid = p.id;
        priceIn.dataset.field = 'price';
        priceIn.addEventListener('input', () => {
          const prod = cfgFindProduct(p.id);
          if (prod) prod.price = priceIn.value;
          box.classList.remove('invalid');
        });
        priceWrap.appendChild(cur);
        priceWrap.appendChild(priceIn);
        box.appendChild(delBtn);
        box.appendChild(nameIn);
        box.appendChild(priceWrap);
        configRowByPid.set(p.id, box);
        grid.appendChild(box);
      });
      const addBtn = document.createElement('button');
      addBtn.className = 'cfg-add-box';
      addBtn.textContent = '＋ Agregar producto';
      addBtn.dataset.cat = cat.id;
      addBtn.dataset.sec = sec.id;
      addBtn.addEventListener('click', () => {
        const count = sec.items.length;
        sec.items.push({ id: cfgNewId(), name: '', price: '', color: CFG_PALETTE[count % CFG_PALETTE.length] });
        renderConfig();
        const newRow = configRowByPid.get(sec.items[sec.items.length - 1].id);
        const firstIn = newRow ? newRow.querySelector('.cfg-name') : null;
        if (firstIn && firstIn.focus) firstIn.focus();
      });
      grid.appendChild(addBtn);
      body.appendChild(grid);
    });
  });
  document.querySelectorAll('textarea.cfg-name').forEach(autoGrowCfgName);
}
document.getElementById('btnGuardarConfig').addEventListener('click', () => {
  // Validar: nombre no vacío y precio > 0
  let firstInvalidRow = null;
  configRowByPid.forEach((row, pid) => row.classList.remove('invalid'));
  for (const cat of configDraft) for (const sec of cat.sections) for (const p of sec.items) {
    const okName = String(p.name || '').trim().length > 0;
    const pv = parseFloat(p.price);
    const okPrice = !isNaN(pv) && pv > 0;
    if (!okName || !okPrice) {
      const row = configRowByPid.get(p.id);
      if (row) {
        row.classList.add('invalid');
        if (!firstInvalidRow) firstInvalidRow = row;
      }
    }
  }
  if (firstInvalidRow) {
    if (firstInvalidRow.scrollIntoView) firstInvalidRow.scrollIntoView({ block: 'center' });
    toast('Revisa los campos en rojo: nombre y precio (> 0)');
    return;
  }
  // Normalizar y guardar
  for (const cat of configDraft) for (const sec of cat.sections) for (const p of sec.items) {
    p.name = String(p.name).trim();
    p.price = parseFloat(p.price);
  }
  catalog = configDraft;
  save(LS_CATALOG, catalog);
  // Quitar del ticket productos que ya no existen
  Object.keys(ticket).forEach(id => { if (!productById(id)) { delete ticket[id]; delete ticketNotas[id]; } });
  saveTicket();
  if (!catalog.find(c => c.id === activeCat)) activeCat = catalog[0] ? catalog[0].id : null;
  renderTabs(); renderGrid(); renderTicket();
  toast('Configuración guardada');
});

applyNombreSucursal();
renderTabs();
renderGrid();
renderTicket();
refreshSessionBtns();
updateHomeComandas();
showScreen(screenFromHash());
