<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Punto de venta - Taquería "El Vergel"</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f2f6f2;
    --panel: #ffffff;
    --panel2: #e9f2ec;
    --border: #c9dcd0;
    --text: #16281c;
    --muted: #5f7d68;
    --accent: #23461e;
    --accent-d: #1b3a17;
    --accent-l: #2e7d46;
    --pay: #f59e0b;
    --pay-text: #241a04;
    --danger: #dc2626;
    --radius: 14px;
  }
  html, body { height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
  }

  /* ---------- Top bar ---------- */
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    background: var(--accent);
    border-bottom: 1px solid var(--accent-d);
    flex-wrap: wrap;
  }
  header .logo {
    width: 52px; height: 52px;
    border-radius: 50%;
    object-fit: cover;
    flex-shrink: 0;
    border: 2px solid rgba(255,255,255,.65);
    background: #fff;
  }
  header .brand { font-size: 20px; font-weight: 800; letter-spacing: .3px; color: #fff; }
  header .brand span { color: #a7f3c0; }
  header .clock { color: rgba(255,255,255,.75); font-size: 15px; font-variant-numeric: tabular-nums; }
  header .spacer { flex: 1; }
  .hbtn {
    border: 1px solid rgba(255,255,255,.35);
    background: rgba(255,255,255,.12);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    padding: 10px 16px;
    border-radius: 10px;
    cursor: pointer;
    min-height: 44px;
  }
  .hbtn:hover { background: rgba(255,255,255,.24); }
  .hbtn.open { border-color: #a7f3c0; color: #a7f3c0; }

  /* ---------- Layout ---------- */
  main {
    flex: 1;
    min-height: 0;
    display: flex;
    gap: 14px;
    padding: 14px;
    align-items: stretch;
  }
  .left { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  #grid { flex: 1; overflow-y: auto; min-height: 0; }
  .tabs { display: flex; gap: 10px; margin-bottom: 12px; }
  .tab {
    flex: 1;
    padding: 14px 10px;
    font-size: 19px;
    font-weight: 800;
    text-align: center;
    border-radius: var(--radius);
    border: 2px solid var(--border);
    background: var(--panel);
    color: var(--muted);
    cursor: pointer;
    min-height: 56px;
  }
  .tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .sec-title {
    font-size: 19px;
    font-weight: 800;
    color: var(--accent);
    margin: 16px 0 10px;
  }
  .sec-title:first-child { margin-top: 0; }
  .empty-state { color: var(--muted); font-size: 16px; padding: 24px 8px; }
  .sec-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 16px;
    margin-bottom: 6px;
  }
  .tile {
    border: none;
    border-radius: var(--radius);
    padding: 24px 16px 18px;
    min-height: 160px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: space-between;
    cursor: pointer;
    color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,.45);
    box-shadow: 0 3px 10px rgba(20,50,30,.28);
    transition: transform .06s ease;
    text-align: left;
  }
  .tile:active { transform: scale(.96); }
  .tile .price { font-size: 28px; font-weight: 800; }
  .tile .name { font-size: 21px; font-weight: 700; line-height: 1.15; overflow-wrap: break-word; }
  .tile .qty-badge {
    align-self: flex-end;
    background: rgba(0,0,0,.45);
    border-radius: 999px;
    padding: 3px 12px;
    font-size: 16px;
    font-weight: 800;
    display: none;
  }
  .tile .qty-badge.show { display: inline-block; }

  /* ---------- Ticket ---------- */
  .ticket {
    width: 412px;
    flex-shrink: 0;
    min-height: 0;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .ticket h2 { padding: 14px 16px 8px; font-size: 18px; }
  .ticket-items { flex: 1; overflow-y: auto; padding: 0 12px; min-height: 0; }
  .titem {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 10px 4px;
    border-bottom: 1px solid var(--border);
  }
  .trow1 { display: flex; align-items: flex-start; gap: 8px; }
  .trow1 .tname { flex: 1; min-width: 0; font-size: 15px; overflow-wrap: break-word; }
  .trow2 { display: flex; align-items: center; gap: 8px; }
  .trow2 .tunit { color: var(--muted); font-size: 12px; }
  .trow2 .tqty-ctl { display: flex; align-items: center; gap: 6px; }
  .qbtn {
    width: 36px; height: 36px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: var(--panel2);
    color: var(--text);
    font-size: 19px; font-weight: 800;
    cursor: pointer;
    flex-shrink: 0;
  }
  .qbtn:active { background: #d7e8dc; }
  .trow2 .tqty { min-width: 26px; text-align: center; font-weight: 800; font-size: 16px; }
  .trow2 .tsub { margin-left: auto; min-width: 84px; text-align: right; font-weight: 700; font-size: 15px; }
  .trow1 .rm {
    width: 30px; height: 30px;
    border: none; background: none;
    color: var(--danger); font-size: 18px; font-weight: 800;
    cursor: pointer; flex-shrink: 0;
  }
  .empty-ticket { color: var(--muted); text-align: center; padding: 34px 12px; font-size: 15px; }
  .ticket-foot { padding: 12px 16px 16px; border-top: 1px solid var(--border); }
  .total-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
  .total-row .lbl { color: var(--muted); font-size: 16px; font-weight: 700; }
  .total-row .val { font-size: 34px; font-weight: 900; font-variant-numeric: tabular-nums; color: var(--accent); }
  .ticket-btns { display: flex; gap: 10px; }
  .btn-clear {
    padding: 14px 16px;
    border-radius: 12px;
    border: 1px solid #f3c2c2;
    background: #fdecec;
    color: #c62828;
    font-size: 16px; font-weight: 700;
    cursor: pointer;
  }
  .btn-pay {
    flex: 1;
    padding: 14px 16px;
    border-radius: 12px;
    border: none;
    background: var(--pay);
    color: var(--pay-text);
    font-size: 20px; font-weight: 900;
    cursor: pointer;
    min-height: 56px;
  }
  .btn-pay:disabled { background: #d8ded9; color: #8a978d; cursor: not-allowed; }

  /* ---------- Modals ---------- */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(20,40,28,.55);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 50;
  }
  .overlay.show { display: flex; }
  .modal {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 18px;
    width: 100%;
    max-width: 480px;
    max-height: 90vh;
    overflow-y: auto;
    padding: 22px;
  }
  .modal h3 { font-size: 21px; margin-bottom: 14px; color: var(--accent); }
  .modal .big-total { font-size: 38px; font-weight: 900; margin: 6px 0 14px; font-variant-numeric: tabular-nums; }
  .field label { display: block; color: var(--muted); font-weight: 700; font-size: 14px; margin-bottom: 6px; }
  .field input {
    width: 100%;
    font-size: 26px;
    font-weight: 800;
    padding: 12px 14px;
    border-radius: 12px;
    border: 2px solid var(--border);
    background: var(--panel2);
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }
  .field input:focus { outline: none; border-color: var(--accent); }
  .field input.txt, .field textarea.txt {
    font-size: 17px;
    font-weight: 600;
    font-variant-numeric: normal;
    resize: vertical;
    font-family: inherit;
  }
  .field textarea.txt:focus { outline: none; border-color: var(--accent); }
  .ticket-cliente { padding: 0 16px 10px; }
  .ticket-cliente input, .ticket-detalles input {
    width: 100%; box-sizing: border-box;
    font-size: 16px; font-weight: 600; font-family: inherit;
    padding: 10px 12px; border-radius: 10px;
    border: 2px solid var(--border); background: var(--panel2); color: var(--text);
  }
  .ticket-cliente input:focus, .ticket-detalles input:focus { outline: none; border-color: var(--accent); }
  .t-det-btn {
    align-self: flex-start;
    margin-left: 14px;
    border: 1px dashed var(--border);
    background: none;
    color: var(--muted);
    font-size: 13px; font-weight: 700; font-family: inherit;
    padding: 5px 10px; border-radius: 8px;
    cursor: pointer;
  }
  .t-det-btn:active { background: var(--panel2); }
  .t-det-editor { margin-left: 14px; }
  .t-det-input {
    width: 100%; box-sizing: border-box;
    font-size: 14px; font-weight: 600; font-family: inherit;
    padding: 7px 10px; border-radius: 8px;
    border: 2px solid var(--border); background: var(--panel2); color: var(--text);
  }
  .t-det-input:focus { outline: none; border-color: var(--accent); }
  .t-det-note {
    margin-left: 14px;
    display: flex; align-items: flex-start; gap: 6px;
    font-size: 14px; color: var(--text);
    background: var(--panel2); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 8px 6px 10px;
  }
  .t-det-note .t-det-text { flex: 1; min-width: 0; cursor: pointer; overflow-wrap: break-word; }
  .t-det-note .t-det-x {
    border: none; background: none; color: var(--danger);
    font-size: 15px; font-weight: 800; cursor: pointer; flex-shrink: 0; padding: 0 2px;
  }
  .ticket-detalles { margin-bottom: 12px; }
  .quick { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
  .qchip {
    border: 1px solid var(--border);
    background: var(--panel2);
    color: var(--text);
    font-size: 15px; font-weight: 700;
    padding: 9px 14px;
    border-radius: 999px;
    cursor: pointer;
  }
  .qchip:active { background: #d7e8dc; }
  .change-row {
    display: flex; justify-content: space-between; align-items: baseline;
    margin: 14px 0; padding: 12px 14px;
    background: var(--panel2); border-radius: 12px;
  }
  .change-row .lbl { color: var(--muted); font-weight: 700; }
  .change-row .val { font-size: 28px; font-weight: 900; font-variant-numeric: tabular-nums; color: var(--accent); }
  .change-row.bad .val { color: var(--danger); }
  .modal-btns { display: flex; gap: 10px; margin-top: 16px; }
  .btn-cancel {
    padding: 14px 18px; border-radius: 12px;
    border: 1px solid var(--border); background: var(--panel2);
    color: var(--muted); font-size: 16px; font-weight: 700; cursor: pointer;
  }
  .btn-ok {
    flex: 1; padding: 14px 18px; border-radius: 12px; border: none;
    background: var(--accent); color: #fff;
    font-size: 18px; font-weight: 900; cursor: pointer; min-height: 54px;
  }
  .btn-ok:disabled { background: #d8ded9; color: #8a978d; cursor: not-allowed; }
  .btn-danger {
    padding: 14px 18px; border-radius: 12px; border: none;
    background: var(--danger); color: #fff;
    font-size: 16px; font-weight: 800; cursor: pointer;
  }
  .summary-row { display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 16px; }
  .summary-row b { font-variant-numeric: tabular-nums; }
  .summary-row.total { font-size: 19px; font-weight: 900; border-bottom: none; color: var(--accent); }
  .sale-item { padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
  .sale-item .st { color: var(--muted); font-size: 12px; }
  .sale-item .sa { float: right; font-weight: 800; }
  .note { color: var(--muted); font-size: 14px; margin-top: 10px; line-height: 1.45; }
  .toast {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
    background: #fff; color: #16281c; border: 2px solid var(--accent);
    font-weight: 800; font-size: 16px;
    padding: 13px 22px; border-radius: 999px;
    box-shadow: 0 6px 24px rgba(0,0,0,.5);
    display: none; z-index: 99;
  }
  .toast.show { display: block; }

  /* ---------- Pantallas ---------- */
  .screen { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .screen.hidden { display: none; }
  .sheader {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px;
    background: var(--accent);
    border-bottom: 1px solid var(--accent-d);
  }
  .sheader .stitle { font-size: 20px; font-weight: 800; color: #fff; }
  .back-btn {
    display: inline-flex; align-items: center; gap: 7px;
    border: 1px solid rgba(255,255,255,.35);
    background: rgba(255,255,255,.12);
    color: #fff;
    font-size: 15px; font-weight: 700;
    padding: 10px 14px; border-radius: 10px;
    cursor: pointer; min-height: 44px;
  }
  .back-btn svg { flex: 0 0 auto; display: block; }
  .back-btn:hover { background: rgba(255,255,255,.24); }

  /* ---------- Pantalla de inicio ---------- */
  #screenHome { overflow-y: auto; }
  .home-wrap {
    flex: 0 0 auto;
    width: 100%; max-width: 680px; margin: auto;
    padding: 18px 18px 28px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .home-header {
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 12px;
    padding: 36px 20px;
    background: #1e5631;
    color: #fff;
    box-shadow: 0 6px 18px rgba(35,70,30,.22);
  }
  .home-header-text { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
  .home-logo-tile {
    width: 140px; height: 140px; flex: 0 0 auto;
    background: #fff; border-radius: 42px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 16px rgba(0,0,0,.18);
  }
  .home-logo {
    width: 124px; height: 124px;
    border-radius: 50%; object-fit: cover;
    background: #fff;
  }
  .home-title { font-size: 32px; font-weight: 900; color: #fff; line-height: 1.15; }
  .home-title span { color: #c9e7cf; }
  .home-pill {
    align-self: center;
    margin-top: 10px;
    padding: 10px 22px; border-radius: 999px;
    font-size: 17px; font-weight: 800;
    background: rgba(255,255,255,.92); color: #c62828;
  }
  .home-pill::before { content: '●'; margin-right: 8px; font-size: 12px; vertical-align: 2px; }
  .home-pill.open { background: rgba(255,255,255,.92); color: #1e7a3c; }
  .home-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 18px; }
  .home-card {
    display: flex; align-items: center; gap: 16px;
    padding: 18px 20px; min-height: 84px;
    border-radius: 20px; border: none;
    text-align: left; cursor: pointer;
    color: #1b3a17;
    box-shadow: 0 8px 20px rgba(35,70,30,.20);
    transition: transform .08s ease, box-shadow .08s ease;
  }
  .home-card:active { transform: scale(.98); box-shadow: 0 4px 12px rgba(35,70,30,.20); }
  .home-card.primary { background: #a5d6a7; }
  .home-card.alt { background: #a5d6a7; }
  .home-card.alt2 { background: #a5d6a7; }
  .hc-icon {
    width: 52px; height: 52px; border-radius: 15px;
    background: rgba(27,58,23,.14);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .hc-icon svg { width: 28px; height: 28px; }
  .hc-text { display: flex; flex-direction: column; min-width: 0; }
  .hc-title { font-size: 20px; font-weight: 900; line-height: 1.15; }
  .hc-sub { font-size: 13px; opacity: .88; margin-top: 3px; }
  .home-row { display: flex; gap: 16px; }
  .home-mini {
    flex: 1; min-height: 68px;
    background: #fff; color: var(--accent);
    border: 2px solid var(--accent);
    border-radius: 16px;
    font-size: 15px; font-weight: 800;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(35,70,30,.10);
  }
  .home-mini:active { background: var(--panel2); }
  .home-mini.open { border-color: var(--accent-l); color: var(--accent-l); }
  .home-mini:disabled, .home-mini.disabled { opacity: .45; cursor: not-allowed; pointer-events: none; }

  /* ---------- Pantalla de ventas ---------- */
  .ventas-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .ventas-summary { display: flex; gap: 12px; padding: 14px 18px 0; }
  .vs-card {
    flex: 1; min-width: 0;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    box-shadow: 0 4px 12px rgba(35,70,30,.08);
  }
  .vs-card .vs-label { display: block; font-size: 12px; font-weight: 800; letter-spacing: .5px; text-transform: uppercase; color: var(--muted); }
  .vs-card .vs-value { display: block; font-size: 24px; font-weight: 900; color: var(--accent); font-variant-numeric: tabular-nums; margin-top: 4px; }
  .ventas-body { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 18px; }
  .venta-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 12px;
    box-shadow: 0 4px 12px rgba(35,70,30,.06);
  }
  .venta-card .vc-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 6px; }
  .venta-card .vc-total { font-size: 21px; font-weight: 900; color: var(--accent); font-variant-numeric: tabular-nums; }
  .venta-card .vc-time { color: var(--muted); font-size: 13px; font-weight: 600; white-space: nowrap; }
  .venta-card .vc-cliente { font-size: 15px; font-weight: 800; color: var(--accent-d); margin-bottom: 4px; }
  .venta-card .vc-items { font-size: 14px; line-height: 1.5; }
  .venta-card .vc-nota { font-style: italic; color: var(--muted); }
  .venta-card .vc-detalles { font-size: 14px; font-style: italic; color: var(--muted); margin-top: 4px; }
  .venta-card .vc-foot { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .vc-badge {
    font-size: 12px; font-weight: 700;
    padding: 4px 10px; border-radius: 999px;
    background: var(--panel2); color: var(--accent-d);
    border: 1px solid var(--border);
  }
  .vc-badge.warn { background: #fdecec; color: #b91c1c; border-color: #f3c6c6; }
  .ventas-empty { text-align: center; color: var(--muted); font-size: 16px; padding: 48px 16px; }
  .ventas-actions { display: flex; justify-content: flex-end; padding: 0 18px 14px; }
  .btn-link-danger {
    background: transparent;
    border: 1px solid #f3c6c6;
    color: #b91c1c;
    border-radius: 10px;
    font-size: 13px; font-weight: 700;
    padding: 8px 14px;
    cursor: pointer;
  }
  .btn-link-danger:active { background: #fdecec; }

  /* ---------- Comandas ---------- */
  .comandas-body { flex: 1; min-height: 0; display: flex; padding: 14px; overflow: hidden; }
  .comandas-col { flex: 1; min-width: 0; overflow-y: auto; padding: 0 12px; }
  .comandas-col:first-child { padding-left: 0; }
  .comandas-col:last-child { padding-right: 0; border-left: 2px solid var(--border); }
  .comandas-col h2 { font-size: 19px; color: var(--accent); margin: 0 0 10px; }
  .comanda-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px 14px;
    margin-bottom: 12px;
  }
  .comanda-card .c-head { display: flex; justify-content: space-between; align-items: baseline; font-weight: 900; margin-bottom: 8px; }
  .comanda-card .c-time { color: var(--muted); font-weight: 600; font-size: 13px; }
  .comanda-card .c-cliente { font-size: 15px; font-weight: 800; color: var(--accent); margin-bottom: 6px; }
  .comanda-card .c-detalles { font-size: 14px; font-style: italic; color: var(--muted); margin-bottom: 6px; }
  .comanda-card .c-item { display: flex; justify-content: space-between; font-size: 14px; padding: 3px 0; }
  .comanda-card .c-total { text-align: right; font-weight: 900; font-size: 18px; color: var(--accent); margin: 8px 0; }
  .comanda-card .c-btns { display: flex; gap: 8px; width: 50%; margin-left: auto; }
  .c-btn { flex: 1; padding: 12px; border-radius: 10px; border: none; font-weight: 800; font-size: 15px; cursor: pointer; min-height: 44px; }
  .c-btn.deliver { background: var(--panel2); color: var(--accent); border: 1px solid var(--border); }
  .c-btn.pay { background: var(--pay); color: var(--pay-text); }

  /* ---------- Configuración ---------- */
  .config-body { flex: 1; overflow-y: auto; padding: 14px 14px 96px; width: 100%; margin: 0 auto; }
  .config-body.hidden { display: none; }
  .config-body h2 { font-size: 19px; color: var(--accent); margin: 16px 0 8px; }
  .config-body h2:first-child { margin-top: 0; }
  .config-body h3 { font-size: 15px; color: var(--muted); margin: 10px 0 6px; }
  .cfg-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 16px;
    margin-bottom: 6px;
  }
  .cfg-box {
    position: relative;
    border-radius: var(--radius);
    padding: 18px 14px 14px;
    min-height: 140px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 8px;
    box-shadow: 0 3px 10px rgba(20,50,30,.28);
    color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,.45);
  }
  .cfg-box textarea.cfg-name {
    background: transparent;
    border: none;
    color: #fff;
    font-family: inherit;
    font-size: 16px; font-weight: 700; line-height: 1.2;
    width: 100%;
    padding: 4px 26px 4px 4px;
    border-radius: 8px;
    text-shadow: 0 1px 3px rgba(0,0,0,.45);
    resize: none;
    overflow: hidden;
    display: block;
    min-height: 24px;
  }
  .cfg-box textarea.cfg-name:focus { outline: 2px solid rgba(255,255,255,.75); background: rgba(0,0,0,.18); }
  .cfg-price { position: relative; display: block; }
  .cfg-price .cur {
    position: absolute; left: 4px; top: 50%; transform: translateY(-50%);
    color: #fff; font-size: 21px; font-weight: 800; pointer-events: none;
    text-shadow: 0 1px 3px rgba(0,0,0,.45);
  }
  .cfg-box input.cfg-price-in {
    background: transparent;
    border: none;
    color: #fff;
    font-family: inherit;
    font-size: 21px; font-weight: 800;
    width: 100%;
    padding: 4px 4px 4px 24px;
    border-radius: 8px;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 1px 3px rgba(0,0,0,.45);
    -webkit-appearance: none;
    appearance: textfield;
  }
  .cfg-box input.cfg-price-in::-webkit-outer-spin-button,
  .cfg-box input.cfg-price-in::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .cfg-box input.cfg-price-in:focus { outline: 2px solid rgba(255,255,255,.75); background: rgba(0,0,0,.18); }
  .cfg-del {
    position: absolute; top: 8px; right: 8px;
    width: 30px; height: 30px;
    border-radius: 999px; border: none;
    background: rgba(0,0,0,.45); color: #fff;
    font-size: 17px; font-weight: 800; line-height: 1;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .cfg-del:active { background: #c62828; }
  .cfg-box.invalid { outline: 3px solid #c62828; outline-offset: -3px; }
  .cfg-add-box {
    border: 2px dashed var(--border);
    border-radius: var(--radius);
    background: var(--panel2);
    color: var(--accent);
    font-family: inherit;
    font-size: 16px; font-weight: 800;
    min-height: 140px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    padding: 14px;
    text-align: center;
  }
  .cfg-add-box:active { background: #dcebe1; }
  .config-foot { padding: 12px 14px; border-top: 1px solid var(--border); }
  /* ---------- Pestañas de Configuración ---------- */
  .config-tabs { display: flex; gap: 8px; padding: 12px 14px 0; }
  .config-tab {
    flex: 1; padding: 12px 8px;
    border-radius: 10px; border: 1px solid var(--border);
    background: var(--panel); color: var(--muted);
    font-size: 15px; font-weight: 800; cursor: pointer;
    min-height: 44px;
  }
  .config-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  /* ---------- Dispositivos ---------- */
  .dev-section { margin-bottom: 22px; }
  .dev-section h3 { font-size: 16px; color: var(--accent); margin: 0 0 10px; }
  .dev-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 12px;
    max-width: 50%;
    margin-left: auto;
    margin-right: auto;
  }
  .dev-card .dev-name {
    width: 100%;
    padding: 10px 12px;
    border: 2px solid var(--border);
    border-radius: 10px;
    background: var(--panel2);
    color: var(--text);
    font-family: inherit;
    font-size: 16px; font-weight: 700;
    margin-bottom: 10px;
  }
  .dev-card .dev-name:focus { outline: none; border-color: var(--accent); }
  .dev-card .dev-type {
    width: 100%;
    padding: 10px 12px;
    border: 2px solid var(--border);
    border-radius: 10px;
    background: var(--panel2);
    color: var(--text);
    font-family: inherit;
    font-size: 15px; font-weight: 700;
    margin-bottom: 10px;
  }
  .dev-perms { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 6px 12px; margin-bottom: 12px; }
  .dev-perms label { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: var(--text); cursor: pointer; }
  .dev-perms input { width: 20px; height: 20px; accent-color: var(--accent); }
  .dev-del {
    width: 100%;
    padding: 10px;
    border-radius: 10px; border: 1px solid #f3c6c6;
    background: transparent; color: #b91c1c;
    font-size: 14px; font-weight: 800; cursor: pointer;
  }
  .dev-add {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: 2px dashed var(--border);
    background: var(--panel2);
    color: var(--accent);
    font-size: 16px; font-weight: 800;
    cursor: pointer;
  }
  .dev-note { font-size: 13px; color: var(--muted); line-height: 1.45; margin-top: 10px; }
  .printer-field { margin-bottom: 12px; }
  .printer-field label { display: block; font-size: 14px; font-weight: 700; color: var(--muted); margin-bottom: 6px; }
  .printer-field input[type="text"], .printer-field select {
    width: 100%;
    padding: 10px 12px;
    border: 2px solid var(--border);
    border-radius: 10px;
    background: var(--panel2);
    color: var(--text);
    font-family: inherit;
    font-size: 15px; font-weight: 700;
  }
  .printer-field input:focus, .printer-field select:focus { outline: none; border-color: var(--accent); }
  .printer-name-display {
    width: 100%;
    padding: 10px 12px;
    border: 2px solid var(--border);
    border-radius: 10px;
    background: var(--panel2);
    color: var(--text);
    font-family: inherit;
    font-size: 15px; font-weight: 700;
    min-height: 44px;
    display: flex; align-items: center;
  }
  .printer-name-display.printer-name-empty { color: var(--muted); font-weight: 600; }
  .printer-toggle { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 700; color: var(--text); cursor: pointer; margin-bottom: 14px; }
  .printer-toggle input { width: 22px; height: 22px; accent-color: var(--accent); }
  .btn-print-test {
    width: 50%;
    margin-left: auto;
    margin-right: auto;
    display: block;
    padding: 10px 14px;
    border-radius: 12px; border: none;
    background: var(--accent); color: #fff;
    font-size: 15px; font-weight: 900;
    cursor: pointer; min-height: 44px;
  }
  .btn-print-test:disabled { opacity: .45; cursor: not-allowed; }
  .btn-conectar-impresora {
    width: 50%;
    margin-left: auto;
    margin-right: auto;
    display: block;
    padding: 10px 14px;
    border-radius: 12px; border: none;
    background: var(--accent); color: #fff;
    font-size: 15px; font-weight: 900;
    cursor: pointer; min-height: 44px;
    margin-bottom: 10px;
  }
  .printer-status { font-size: 14px; font-weight: 700; color: var(--accent); margin: 0 0 10px; }
  .printer-status.printer-fallback { color: var(--muted); font-weight: 600; }
  .printer-hint { font-size: 13px; color: var(--muted); line-height: 1.45; margin: 0 0 12px; }
  .printer-field input:disabled, .printer-field select:disabled { opacity: .45; cursor: not-allowed; }
  .printer-toggle:has(input:disabled) { opacity: .45; cursor: not-allowed; }
  /* ---------- Ticket para imprimir ---------- */
  #printTicket { display: none; }
  @media print {
    body > *:not(#printTicket) { display: none !important; }
    #printTicket { display: block !important; }
    @page { margin: 0; }
  }
  #printTicket { font-family: "Courier New", monospace; color: #000; padding: 8px; }
  #printTicket .pt-head { text-align: center; margin-bottom: 8px; }
  #printTicket .pt-title { font-size: 16px; font-weight: 900; }
  #printTicket .pt-sub { font-size: 12px; }
  #printTicket .pt-line { border-top: 1px dashed #000; margin: 6px 0; }
  #printTicket .pt-row { display: flex; justify-content: space-between; font-size: 13px; margin: 2px 0; }
  #printTicket .pt-total { font-size: 15px; font-weight: 900; }
  #printTicket .pt-foot { text-align: center; font-size: 12px; margin-top: 8px; }
  .btn-save-config {
    width: 50%;
    margin-left: auto;
    display: block;
    padding: 10px 14px;
    border-radius: 12px; border: none;
    background: var(--accent); color: #fff;
    font-size: 15px; font-weight: 900;
    cursor: pointer; min-height: 44px;
  }

  /* ---------- Botón Comanda ---------- */
  .btn-comanda {
    flex: 1;
    padding: 14px 10px;
    border-radius: 12px;
    border: none;
    background: var(--accent-l);
    color: #fff;
    font-size: 16px; font-weight: 800;
    cursor: pointer;
    min-height: 56px;
  }
  .btn-comanda:disabled { background: #d8ded9; color: #8a978d; cursor: not-allowed; }

  @media (max-width: 900px) {
    main { flex-direction: column; }
    .ticket { width: 100%; flex: 1; min-height: 0; }
    .sec-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
    .cfg-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
    .comandas-body { flex-direction: column; overflow-y: auto; }
    .comandas-col { overflow-y: visible; padding: 0; }
    .comandas-col:last-child { border-left: none; border-top: 2px solid var(--border); padding-top: 12px; margin-top: 12px; }
  }
</style>
</head>

<script>
/* ================= Catálogo (edita aquí precios y productos) ================= */
const CATALOG_DEFAULTS = [
  { id: 'tacos', label: 'Tacos', sections: [
    { id: 'ordenes', label: 'Órdenes', items: [
      { id: 'suadero',    name: 'Orden de suadero',    price: 130, color: '#1e5631' },
      { id: 'cuero',      name: 'Orden de cuero',      price: 130, color: '#276749' },
      { id: 'adobada',    name: 'Orden de adobada',    price: 130, color: '#2f855a' },
      { id: 'campechano', name: 'Orden de campechano', price: 130, color: '#38a169' },
    ]},
    { id: 'individual', label: 'Taco individual', items: [
      { id: 'suadero-ind',    name: 'Taco de suadero',    price: 32.50, color: '#1e5631' },
      { id: 'cuero-ind',      name: 'Taco de cuero',      price: 32.50, color: '#276749' },
      { id: 'adobada-ind',    name: 'Taco de adobada',    price: 32.50, color: '#2f855a' },
      { id: 'campechano-ind', name: 'Taco de campechano', price: 32.50, color: '#38a169' },
    ]},
  ]},
  { id: 'bebidas', label: 'Bebidas', sections: [
    { id: 'refrescos', label: 'Refrescos', items: [
      { id: 'coca',   name: 'Coca Cola', price: 30, color: '#2d7d46' },
      { id: 'sprite', name: 'Sprite',    price: 30, color: '#43a047' },
      { id: 'fanta',  name: 'Fanta',     price: 30, color: '#558b2f' },
    ]},
    { id: 'aguas', label: 'Aguas', items: [
      { id: 'jamaica',  name: 'Agua de Jamaica', price: 30, color: '#1b5e20' },
      { id: 'limon',    name: 'Agua de limón',   price: 30, color: '#33691e' },
      { id: 'horchata', name: 'Agua de horchata', price: 30, color: '#2e7d32' },
    ]},
  ]},
  { id: 'otros', label: 'Otros', sections: [
    { id: 'otros', label: null, items: [
      { id: 'dulce', name: 'Dulce', price: 2, color: '#558b2f' },
    ]},
  ]},
];

/* ================= Estado ================= */
const LS_SALES   = 'pvtaqueria_sales';
const LS_SESSION = 'pvtaqueria_session';
const LS_CORTES  = 'pvtaqueria_cortes';
const LS_LASTCUT = 'pvtaqueria_lastCorteIndex';
const LS_COMANDAS = 'pvtaqueria_comandas';
const LS_COMANDA_SEQ = 'pvtaqueria_comandaSeq';
const LS_CATALOG = 'pvtaqueria_catalog';
const LS_TICKET  = 'pvtaqueria_ticket';
const LS_TAB     = 'pvtaqueria_tab';
const LS_CONFIG_TAB = 'pvtaqueria_config_tab';
const LS_PRINTER = 'pvtaqueria_printer';
const LS_DEVICES = 'pvtaqueria_devices';
const LS_NOMBRE = 'pvtaqueria_nombre';

let catalog = load(LS_CATALOG, null);
if (!catalog) catalog = JSON.parse(JSON.stringify(CATALOG_DEFAULTS));

let ticket = {};           // productId -> qty (persiste entre recargas)
let ticketCliente = '';    // nombre del cliente (opcional)
let ticketDetalles = '';   // detalles generales (opcional)
let ticketNotas = {};      // productId -> nota por producto (opcional)
(function loadTicketState() {
  const saved = load(LS_TICKET, null);
  if (saved && typeof saved === 'object' && saved.items && typeof saved.items === 'object') {
    ticket = saved.items || {};
    ticketCliente = saved.cliente || '';
    ticketDetalles = saved.detalles || '';
    ticketNotas = saved.notas || {};
  } else if (saved && typeof saved === 'object') {
    ticket = saved; // formato viejo: { productId: qty }
  }
  Object.keys(ticket).forEach(id => { if (!productById(id) || !(ticket[id] > 0)) delete ticket[id]; });
  Object.keys(ticketNotas).forEach(id => { if (!productById(id) || !ticket[id]) delete ticketNotas[id]; });
})();
let activeCat = load(LS_TAB, null);
if (!catalog.find(c => c.id === activeCat)) activeCat = catalog[0] ? catalog[0].id : null;
let comandas = load(LS_COMANDAS, []);
let comandaSeq = load(LS_COMANDA_SEQ, 0);
let sales = load(LS_SALES, []);
let session = load(LS_SESSION, null);            // { opening, startISO, salesStartIndex }
let cortes = load(LS_CORTES, []);                // cortes X (parciales) y Z (cierres)
if (!Array.isArray(cortes)) cortes = [];
cortes.forEach(c => { if (c && !c.type) c.type = 'Z'; });   // cortes viejos = Z
let lastCorteIndex = load(LS_LASTCUT, 0);        // sales index since last corte (when no session)
let configTab = load(LS_CONFIG_TAB, 'productos');
if (configTab !== 'productos' && configTab !== 'dispositivos' && configTab !== 'general') configTab = 'productos';
let nombreSucursal = load(LS_NOMBRE, null) || "Taquería 'El Vergel'";
let printerSettings = load(LS_PRINTER, null) || { nombre: '', ancho: 80, autoPrint: false };
if (printerSettings.ancho !== 58 && printerSettings.ancho !== 80) printerSettings.ancho = 80;
let devices = load(LS_DEVICES, null);
if (devices === null) {
  devices = [{ id: 'dev-' + Date.now().toString(36), nombre: 'Este dispositivo', tipo: 'Celular', permisos: { pos: true, comandas: true, cobrar: true, cortes: true, ventas: true, configuracion: true } }];
  save(LS_DEVICES, devices);
}
if (!Array.isArray(devices)) devices = [];

function load(key, fallback) {
  try { const v = JSON.parse(localStorage.getItem(key)); return v == null ? fallback : v; }
  catch (e) { return fallback; }
}
function save(key, val) { localStorage.setItem(key, JSON.stringify(val)); }

function productById(id) {
  for (const cat of catalog) for (const sec of cat.sections) for (const p of sec.items) if (p.id === id) return p;
  return null;
}
function fmt(n) {
  return '$' + Number(n).toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function nowISO() { return new Date().toISOString(); }
function fmtDateTime(iso) {
  const d = new Date(iso);
  return d.toLocaleString('es-MX', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}

/* ================= Reloj ================= */
function tickClock() {
  document.getElementById('clock').textContent =
    new Date().toLocaleString('es-MX', { weekday: 'short', day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit', second: '2-digit' });
}
setInterval(tickClock, 1000); tickClock();

/* ================= Toast ================= */
let toastTimer = null;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ================= Modales ================= */
function showOv(id) { document.getElementById(id).classList.add('show'); }
function hideOv(id) { document.getElementById(id).classList.remove('show'); }
document.querySelectorAll('[data-close]').forEach(b =>
  b.addEventListener('click', () => hideOv(b.dataset.close)));
document.querySelectorAll('.overlay').forEach(ov =>
  ov.addEventListener('click', e => { if (e.target === ov) ov.classList.remove('show'); }));

/* ================= Catálogo / grid ================= */
function renderTabs() {
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = '';
  catalog.forEach(cat => {
    const b = document.createElement('button');
    b.className = 'tab' + (cat.id === activeCat ? ' active' : '');
    b.textContent = cat.label;
    b.addEventListener('click', () => { activeCat = cat.id; save(LS_TAB, activeCat); renderTabs(); renderGrid(); });
    tabs.appendChild(b);
  });
}
function makeTile(p) {
  const b = document.createElement('button');
  b.className = 'tile';
  b.style.background = p.color;
  const qty = ticket[p.id] || 0;
  b.innerHTML = '<span class="price">' + fmt(p.price) + '</span>' +
                '<span class="name">' + p.name + '</span>' +
                '<span class="qty-badge' + (qty > 0 ? ' show' : '') + '">x' + qty + '</span>';
  b.addEventListener('click', () => addToTicket(p.id));
  return b;
}
function renderGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  const cat = catalog.find(c => c.id === activeCat);
  cat.sections.forEach(sec => {
    if (sec.label) {
      const h = document.createElement('div');
      h.className = 'sec-title';
      h.textContent = sec.label;
      grid.appendChild(h);
    }
    const g = document.createElement('div');
    g.className = 'sec-grid';
    if (!sec.items.length) {
      const e = document.createElement('div');
      e.className = 'empty-state';
      e.textContent = 'Sin productos por ahora';
      g.appendChild(e);
    }
    sec.items.forEach(p => g.appendChild(makeTile(p)));
    grid.appendChild(g);
  });
}

/* ================= Ticket ================= */
function ticketTotal() {
  let total = 0;
  for (const id in ticket) {
    const p = productById(id);
    if (p) total += p.price * ticket[id];
  }
  return total;
}
function openNotaEditor(id, row) {
  if (row.querySelector('.t-det-editor')) return;
  const wrap = document.createElement('div');
  wrap.className = 't-det-editor';
  const inp = document.createElement('input');
  inp.type = 'text';
  inp.className = 't-det-input';
  inp.placeholder = 'Detalle (opcional)';
  inp.maxLength = 80;
  inp.value = ticketNotas[id] || '';
  wrap.appendChild(inp);
  row.appendChild(wrap);
  const finish = () => { renderTicket(); };
  inp.addEventListener('input', () => {
    const v = inp.value.trim();
    if (v) ticketNotas[id] = v; else delete ticketNotas[id];
    saveTicket();
  });
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') { inp.blur(); } });
  inp.addEventListener('blur', finish);
  inp.focus();
}
function renderTicket() {
  const box = document.getElementById('ticketItems');
  const inpC = document.getElementById('inpTicketCliente');
  if (inpC && inpC.value !== ticketCliente) inpC.value = ticketCliente;
  const inpD = document.getElementById('inpTicketDetalles');
  if (inpD && inpD.value !== ticketDetalles) inpD.value = ticketDetalles;
  const ids = Object.keys(ticket).filter(id => ticket[id] > 0);
  if (!ids.length) {
    box.innerHTML = '<div class="empty-ticket">Toca un producto para agregarlo al ticket.</div>';
  } else {
    box.innerHTML = '';
    ids.forEach(id => {
      const p = productById(id);
      if (!p) return; // producto eliminado desde Configuración
      const row = document.createElement('div');
      row.className = 'titem';
      row.innerHTML =
        '<div class="trow1"><b class="tname">' + p.name + '</b>' +
        '<button class="rm" data-act="rm">×</button></div>' +
        '<div class="trow2">' +
        '<span class="tunit">' + fmt(p.price) + ' c/u</span>' +
        '<span class="tqty-ctl">' +
        '<button class="qbtn" data-act="dec">−</button>' +
        '<span class="tqty">' + ticket[id] + '</span>' +
        '<button class="qbtn" data-act="inc">+</button>' +
        '</span>' +
        '<span class="tsub">' + fmt(p.price * ticket[id]) + '</span>' +
        '</div>';
      row.querySelector('[data-act="dec"]').addEventListener('click', () => changeQty(id, -1));
      row.querySelector('[data-act="inc"]').addEventListener('click', () => changeQty(id, 1));
      row.querySelector('[data-act="rm"]').addEventListener('click', () => { delete ticket[id]; delete ticketNotas[id]; refreshAll(); });
      const nota = ticketNotas[id];
      if (nota) {
        const noteEl = document.createElement('div');
        noteEl.className = 't-det-note';
        const txt = document.createElement('span');
        txt.className = 't-det-text';
        txt.textContent = nota;
        txt.addEventListener('click', () => openNotaEditor(id, row));
        const x = document.createElement('button');
        x.className = 't-det-x';
        x.textContent = '×';
        x.addEventListener('click', () => { delete ticketNotas[id]; saveTicket(); renderTicket(); });
        noteEl.appendChild(txt);
        noteEl.appendChild(x);
        row.appendChild(noteEl);
      } else {
        const btn = document.createElement('button');
        btn.className = 't-det-btn';
        btn.textContent = '＋ Agregar detalles';
        btn.addEventListener('click', () => openNotaEditor(id, row));
        row.appendChild(btn);
      }
      box.appendChild(row);
    });
  }
  const total = ticketTotal();
  document.getElementById('totalVal').textContent = fmt(total);
  document.getElementById('btnComanda').disabled = total <= 0;
}
function saveTicket() {
  Object.keys(ticket).forEach(id => { if (!productById(id) || !(ticket[id] > 0)) { delete ticket[id]; delete ticketNotas[id]; } });
  Object.keys(ticketNotas).forEach(id => { if (!ticket[id]) delete ticketNotas[id]; });
  save(LS_TICKET, { items: ticket, cliente: ticketCliente, detalles: ticketDetalles, notas: ticketNotas });
}
function refreshAll() { renderGrid(); renderTicket(); saveTicket(); }
function addToTicket(id) { ticket[id] = (ticket[id] || 0) + 1; refreshAll(); }
function changeQty(id, delta) {
  ticket[id] = (ticket[id] || 0) + delta;
  if (ticket[id] <= 0) delete ticket[id];
  refreshAll();
}
const inpTicketCliente = document.getElementById('inpTicketCliente');
const inpTicketDetalles = document.getElementById('inpTicketDetalles');
inpTicketCliente.addEventListener('input', () => { ticketCliente = inpTicketCliente.value; saveTicket(); });
inpTicketDetalles.addEventListener('input', () => { ticketDetalles = inpTicketDetalles.value; saveTicket(); });
document.getElementById('btnVaciar').addEventListener('click', () => {
  if (!Object.keys(ticket).length && !ticketCliente && !ticketDetalles && !Object.keys(ticketNotas).length) return;
  ticket = {}; ticketCliente = ''; ticketDetalles = ''; ticketNotas = {};
  inpTicketCliente.value = ''; inpTicketDetalles.value = '';
  refreshAll();
});
document.getElementById('btnComanda').addEventListener('click', () => {
  const ids = Object.keys(ticket).filter(id => ticket[id] > 0 && productById(id));
  if (!ids.length) return;
  const items = ids.map(id => {
    const p = productById(id);
    const it = { id: p.id, name: p.name, price: p.price, qty: ticket[id], subtotal: p.price * ticket[id] };
    const nota = (ticketNotas[id] || '').trim();
    if (nota) it.nota = nota;
    return it;
  });
  const nombre = ticketCliente.trim();
  const detalles = ticketDetalles.trim();
  comandaSeq += 1;
  const comanda = { id: comandaSeq, datetime: nowISO(), items: items, total: ticketTotal(), status: 'activa' };
  if (nombre) comanda.cliente = nombre;
  if (detalles) comanda.detalles = detalles;
  comandas.push(comanda);
  save(LS_COMANDAS, comandas);
  save(LS_COMANDA_SEQ, comandaSeq);
  ticket = {}; ticketCliente = ''; ticketDetalles = ''; ticketNotas = {};
  inpTicketCliente.value = ''; inpTicketDetalles.value = '';
  refreshAll();
  updateHomeComandas();
  toast('Comanda #' + comandaSeq + ' creada');
});

/* ================= Cobrar ================= */
const inpRecibido = document.getElementById('inpRecibido');
let payCtx = null; // { kind:'comanda', comanda, total }
function payTotal() { return payCtx ? payCtx.total : 0; }
function openComandaPay(comanda) {
  payCtx = { kind: 'comanda', comanda: comanda, total: comanda.total };
  document.getElementById('cobrarTitle').textContent = 'Cobrar comanda #' + comanda.id;
  document.getElementById('cobrarTotal').textContent = fmt(comanda.total);
  inpRecibido.value = '';
  renderQuickChips(comanda.total);
  updateCambio();
  showOv('ovCobrar');
  setTimeout(() => inpRecibido.focus(), 60);
}
function renderQuickChips(total) {
  const box = document.getElementById('quickChips');
  box.innerHTML = '';
  const opts = [];
  opts.push({ label: 'Exacto', val: total });
  const rounds = [50, 100, 200, 500, 1000];
  rounds.forEach(r => { if (r > total) opts.push({ label: fmt(r), val: r }); });
  opts.forEach(o => {
    const b = document.createElement('button');
    b.className = 'qchip';
    b.textContent = o.label;
    b.addEventListener('click', () => { inpRecibido.value = o.val.toFixed(2); updateCambio(); });
    box.appendChild(b);
  });
}
function updateCambio() {
  const total = payTotal();
  const rec = parseFloat(inpRecibido.value) || 0;
  const cambio = rec - total;
  const row = document.getElementById('changeRow');
  document.getElementById('cambioVal').textContent = fmt(Math.abs(cambio));
  row.classList.toggle('bad', cambio < 0);
  document.getElementById('btnConfirmarCobro').disabled = rec < total;
}
inpRecibido.addEventListener('input', updateCambio);

document.getElementById('btnConfirmarCobro').addEventListener('click', () => {
  if (!payCtx) return;
  const total = payCtx.total;
  const rec = parseFloat(inpRecibido.value) || 0;
  if (rec < total) return;
  let items;
  if (payCtx.kind === 'comanda') {
    items = payCtx.comanda.items.map(i => {
      const it = { id: i.id, name: i.name, price: i.price, qty: i.qty, subtotal: i.subtotal };
      if (i.nota) it.nota = i.nota;
      return it;
    });
    comandas = comandas.filter(c => c.id !== payCtx.comanda.id);
    save(LS_COMANDAS, comandas);
  } else {
    items = Object.keys(ticket).filter(id => ticket[id] > 0 && productById(id)).map(id => {
      const p = productById(id);
      return { id: p.id, name: p.name, price: p.price, qty: ticket[id], subtotal: p.price * ticket[id] };
    });
    ticket = {};
  }
  const venta = {
    id: Date.now(),
    datetime: nowISO(),
    items: items,
    total: total,
    received: rec,
    change: rec - total,
    sessionOpen: !!session
  };
  if (payCtx.kind === 'comanda' && payCtx.comanda.cliente) venta.cliente = payCtx.comanda.cliente;
  if (payCtx.kind === 'comanda' && payCtx.comanda.detalles) venta.detalles = payCtx.comanda.detalles;
  sales.push(venta);
  save(LS_SALES, sales);
  if (printerSettings.autoPrint) printTicketHtml(buildPrintTicketHtml(venta, false));
  refreshAll();
  renderComandas();
  updateHomeComandas();
  hideOv('ovCobrar');
  toast('Venta registrada. Cambio: ' + fmt(rec - total));
});

/* ================= Apertura / Corte ================= */
function refreshSessionBtns() {
  const b = document.getElementById('btnApertura');
  b.classList.toggle('open', !!session);
  b.disabled = !!session;
  b.classList.toggle('disabled', !!session);
  document.getElementById('btnAperturaLabel').textContent = session ? 'Caja abierta' : 'Apertura de caja';
  const pill = document.getElementById('homeCajaState');
  pill.classList.toggle('open', !!session);
  pill.textContent = session ? 'Caja abierta' : 'Caja cerrada';
  ['btnCorteX', 'btnCorteZ'].forEach(id => {
    const btn = document.getElementById(id);
    btn.disabled = !session;
    btn.classList.toggle('disabled', !session);
  });
}
document.getElementById('btnApertura').addEventListener('click', () => {
  if (session) {
    document.getElementById('aperturaForm').style.display = 'none';
    document.getElementById('aperturaAbierta').style.display = 'block';
    document.getElementById('aperturaDesde').textContent = fmtDateTime(session.startISO);
    document.getElementById('aperturaFondoLbl').textContent = fmt(session.opening);
  } else {
    document.getElementById('aperturaForm').style.display = 'block';
    document.getElementById('aperturaAbierta').style.display = 'none';
    document.getElementById('inpFondo').value = '';
  }
  showOv('ovApertura');
});
document.getElementById('btnIniciarCaja').addEventListener('click', () => {
  const fondo = parseFloat(document.getElementById('inpFondo').value) || 0;
  session = { opening: fondo, startISO: nowISO(), salesStartIndex: sales.length };
  save(LS_SESSION, session);
  refreshSessionBtns();
  hideOv('ovApertura');
  toast('Caja abierta con fondo de ' + fmt(fondo));
});
document.getElementById('btnIrCorte').addEventListener('click', () => {
  hideOv('ovApertura'); openCorteZ();
});

function sessionSales() {
  if (session) return sales.slice(session.salesStartIndex);
  return sales.slice(lastCorteIndex);
}
function corteType(c) { return (c && c.type) || 'Z'; }
function xCortesForCurrentSession() {
  if (session) {
    return cortes.filter(c => corteType(c) === 'X' && c.sessionStartISO === session.startISO);
  }
  let lastZ = -1;
  cortes.forEach((c, i) => { if (corteType(c) === 'Z') lastZ = i; });
  return cortes.slice(lastZ + 1).filter(c => corteType(c) === 'X');
}
function buildCorteBody(list, opening, extraHtml) {
  const totalSold = list.reduce((s, v) => s + v.total, 0);
  let html = '';
  html += '<div class="summary-row"><span>Fondo inicial</span><b>' + fmt(opening) + '</b></div>';
  html += '<div class="summary-row"><span>Ventas</span><b>' + list.length + '</b></div>';
  html += '<div class="summary-row"><span>Total vendido</span><b>' + fmt(totalSold) + '</b></div>';
  html += '<div class="summary-row total"><span>Efectivo esperado</span><b>' + fmt(opening + totalSold) + '</b></div>';
  if (!session) html += '<div class="note">Sin caja abierta: se resumen las ventas desde el último corte.</div>';
  if (extraHtml) html += extraHtml;
  if (list.length) {
    html += '<h3 style="font-size:16px;margin:16px 0 6px">Ventas del periodo</h3>';
    list.forEach(v => {
      const itemsTxt = v.items.map(i => i.qty + '× ' + i.name + (i.nota ? ' (' + i.nota + ')' : '')).join(', ');
      html += '<div class="sale-item"><span class="sa">' + fmt(v.total) + '</span>' +
              '<span class="st">' + fmtDateTime(v.datetime) + '</span><br>' + itemsTxt + '</div>';
    });
  } else {
    html += '<div class="note">No hay ventas en este periodo.</div>';
  }
  return { html: html, totalSold: totalSold };
}
function openCorteX() {
  const list = sessionSales();
  const opening = session ? session.opening : 0;
  const r = buildCorteBody(list, opening, '<div class="note">La caja sigue abierta. Puedes seguir vendiendo.</div>');
  document.getElementById('corteTitle').textContent = 'Corte X';
  document.getElementById('corteBody').innerHTML = r.html;
  document.getElementById('btnCerrarCaja').style.display = 'none';
  cortes.push({
    type: 'X',
    datetime: nowISO(),
    opening: opening,
    startISO: session ? session.startISO : null,
    sessionStartISO: session ? session.startISO : null,
    salesCount: list.length,
    totalSold: r.totalSold,
    expectedCash: opening + r.totalSold
  });
  save(LS_CORTES, cortes);
  showOv('ovCorte');
}
function openCorteZ() {
  const pendientes = comandas.filter(c => c.status === 'activa' || c.status === 'completada');
  if (pendientes.length) {
    const activas = pendientes.filter(c => c.status === 'activa').length;
    const sinPagar = pendientes.filter(c => c.status === 'completada').length;
    const partes = [];
    if (activas) partes.push(activas + (activas === 1 ? ' activa' : ' activas'));
    if (sinPagar) partes.push(sinPagar + (sinPagar === 1 ? ' sin pagar' : ' sin pagar'));
    toast('No se puede hacer el Corte Z: hay órdenes activas o sin pagar (' + partes.join(', ') + ').');
    return;
  }
  const list = sessionSales();
  const opening = session ? session.opening : 0;
  const xs = xCortesForCurrentSession();
  let extra = '';
  if (xs.length) {
    extra += '<div class="summary-row"><span>Cortes X realizados</span><b>' + xs.length + '</b></div>';
    extra += '<div class="note">Cortes X: ' + xs.map(c => fmtDateTime(c.datetime || c.closedAt)).join(' · ') + '</div>';
  }
  const r = buildCorteBody(list, opening, extra);
  document.getElementById('corteTitle').textContent = 'Corte Z';
  document.getElementById('corteBody').innerHTML = r.html;
  document.getElementById('btnCerrarCaja').style.display = (list.length || session) ? 'block' : 'none';
  showOv('ovCorte');
}
function openCorte() { openCorteZ(); }
document.getElementById('btnCorteX').addEventListener('click', openCorteX);
document.getElementById('btnCorteZ').addEventListener('click', openCorteZ);
document.getElementById('btnCerrarCaja').addEventListener('click', () => {
  const list = sessionSales();
  const totalSold = list.reduce((s, v) => s + v.total, 0);
  cortes.push({
    type: 'Z',
    closedAt: nowISO(),
    opening: session ? session.opening : 0,
    startISO: session ? session.startISO : (list.length ? list[0].datetime : null),
    salesCount: list.length,
    totalSold: totalSold,
    expectedCash: (session ? session.opening : 0) + totalSold
  });
  save(LS_CORTES, cortes);
  lastCorteIndex = sales.length;
  save(LS_LASTCUT, lastCorteIndex);
  session = null;
  save(LS_SESSION, null);
  refreshSessionBtns();
  hideOv('ovCorte');
  toast('Corte Z registrado: ' + fmt(totalSold) + ' vendidos');
});

/* ================= Ventas (pantalla) ================= */
function renderVentas() {
  const body = document.getElementById('ventasBody');
  const totalEl = document.getElementById('ventasTotal');
  const countEl = document.getElementById('ventasCount');
  const totalVendido = sales.reduce((a, v) => a + (Number(v.total) || 0), 0);
  if (totalEl) totalEl.textContent = fmt(totalVendido);
  if (countEl) countEl.textContent = String(sales.length);
  if (!sales.length) {
    body.innerHTML = '<div class="ventas-empty">Todavía no hay ventas registradas.</div>';
    return;
  }
  let html = '';
  [...sales].reverse().forEach(v => {
    const itemsHtml = v.items.map(i =>
      '<div class="vc-item"><span>' + i.qty + '× ' + escapeHtml(i.name) + '</span>' +
      (i.nota ? ' <span class="vc-nota">(' + escapeHtml(i.nota) + ')</span>' : '') + '</div>'
    ).join('');
    const clienteHtml = v.cliente ? '<div class="vc-cliente">Cliente: ' + escapeHtml(v.cliente) + '</div>' : '';
    const detallesHtml = v.detalles ? '<div class="vc-detalles">Detalles: ' + escapeHtml(v.detalles) + '</div>' : '';
    const badges =
      '<span class="vc-badge">Recibido ' + fmt(v.received) + '</span>' +
      '<span class="vc-badge">Cambio ' + fmt(v.change) + '</span>' +
      (v.sessionOpen ? '' : '<span class="vc-badge warn">Sin sesión</span>');
    html += '<article class="venta-card">' +
      '<div class="vc-head"><span class="vc-total">' + fmt(v.total) + '</span>' +
      '<span class="vc-time">' + fmtDateTime(v.datetime) + '</span></div>' +
      clienteHtml +
      '<div class="vc-items">' + itemsHtml + '</div>' +
      detallesHtml +
      '<div class="vc-foot">' + badges + '</div>' +
      '</article>';
  });
  body.innerHTML = html;
}
document.getElementById('btnLimpiarVentas').addEventListener('click', () => {
  if (!sales.length) return;
  if (!confirm('¿Borrar todo el historial de ventas? Esta acción no se puede deshacer.')) return;
  sales = [];
  save(LS_SALES, sales);
  renderVentas();
  toast('Historial borrado');
});

/* ================= Navegación entre pantallas (rutas por hash) ================= */
const ROUTES = { inicio: 'screenHome', pos: 'screenPos', comandas: 'screenComandas', config: 'screenConfig', ventas: 'screenVentas' };
const SCREEN_HASH = { screenHome: 'inicio', screenPos: 'pos', screenComandas: 'comandas', screenConfig: 'config', screenVentas: 'ventas' };
function screenFromHash() {
  const h = (location.hash || '').replace(/^#\/?/, '');
  return ROUTES[h] || 'screenHome';
}
function showScreen(id, fromHash) {
  document.querySelectorAll('.overlay.show').forEach(ov => ov.classList.remove('show'));
  payCtx = null;
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('hidden', s.id !== id));
  if (id === 'screenComandas') renderComandas();
  if (id === 'screenConfig') openConfig();
  if (id === 'screenVentas') renderVentas();
  if (id === 'screenHome') { updateHomeComandas(); refreshSessionBtns(); }
  if (!fromHash) {
    const target = '#' + (SCREEN_HASH[id] || 'inicio');
    if (location.hash !== target) location.hash = target;
  }
}
window.addEventListener('hashchange', () => { showScreen(screenFromHash(), true); });
document.getElementById('btnHomePos').addEventListener('click', () => showScreen('screenPos'));
document.getElementById('btnHomeComandas').addEventListener('click', () => showScreen('screenComandas'));
document.getElementById('btnHomeConfig').addEventListener('click', () => showScreen('screenConfig'));
document.getElementById('btnHomeVentas').addEventListener('click', () => showScreen('screenVentas'));
document.getElementById('btnBackPos').addEventListener('click', () => showScreen('screenHome'));
document.getElementById('btnBackComandas').addEventListener('click', () => showScreen('screenHome'));
document.getElementById('btnBackConfig').addEventListener('click', () => showScreen('screenHome'));
document.getElementById('btnBackVentas').addEventListener('click', () => showScreen('screenHome'));
