<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Punto de venta - Taquería "El Vergel"</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f2f6f2;
    --panel: #ffffff;
    --panel2: #e9f2ec;
    --border: #c9dcd0;
    --text: #16281c;
    --muted: #5f7d68;
    --accent: #23461e;
    --accent-d: #1b3a17;
    --accent-l: #2e7d46;
    --pay: #f59e0b;
    --pay-text: #241a04;
    --danger: #dc2626;
    --radius: 14px;
  }
  html, body { height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
  }

  /* ---------- Top bar ---------- */
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    background: var(--accent);
    border-bottom: 1px solid var(--accent-d);
    flex-wrap: wrap;
  }
  header .logo {
    width: 52px; height: 52px;
    border-radius: 50%;
    object-fit: cover;
    flex-shrink: 0;
    border: 2px solid rgba(255,255,255,.65);
    background: #fff;
  }
  header .brand { font-size: 20px; font-weight: 800; letter-spacing: .3px; color: #fff; }
  header .brand span { color: #a7f3c0; }
  header .clock { color: rgba(255,255,255,.75); font-size: 15px; font-variant-numeric: tabular-nums; }
  header .spacer { flex: 1; }
  .hbtn {
    border: 1px solid rgba(255,255,255,.35);
    background: rgba(255,255,255,.12);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    padding: 10px 16px;
    border-radius: 10px;
    cursor: pointer;
    min-height: 44px;
  }
  .hbtn:hover { background: rgba(255,255,255,.24); }
  .hbtn.open { border-color: #a7f3c0; color: #a7f3c0; }

  /* ---------- Layout ---------- */
  main {
    flex: 1;
    min-height: 0;
    display: flex;
    gap: 14px;
    padding: 14px;
    align-items: stretch;
  }
  .left { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  #grid { flex: 1; overflow-y: auto; min-height: 0; }
  .tabs { display: flex; gap: 10px; margin-bottom: 12px; }
  .tab {
    flex: 1;
    padding: 14px 10px;
    font-size: 19px;
    font-weight: 800;
    text-align: center;
    border-radius: var(--radius);
    border: 2px solid var(--border);
    background: var(--panel);
    color: var(--muted);
    cursor: pointer;
    min-height: 56px;
  }
  .tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .sec-title {
    font-size: 19px;
    font-weight: 800;
    color: var(--accent);
    margin: 16px 0 10px;
  }
  .sec-title:first-child { margin-top: 0; }
  .empty-state { color: var(--muted); font-size: 16px; padding: 24px 8px; }
  .sec-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 16px;
    margin-bottom: 6px;
  }
  .tile {
    border: none;
    border-radius: var(--radius);
    padding: 24px 16px 18px;
    min-height: 160px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: space-between;
    cursor: pointer;
    color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,.45);
    box-shadow: 0 3px 10px rgba(20,50,30,.28);
    transition: transform .06s ease;
    text-align: left;
  }
  .tile:active { transform: scale(.96); }
  .tile .price { font-size: 28px; font-weight: 800; }
  .tile .name { font-size: 21px; font-weight: 700; line-height: 1.15; overflow-wrap: break-word; }
  .tile .qty-badge {
    align-self: flex-end;
    background: rgba(0,0,0,.45);
    border-radius: 999px;
    padding: 3px 12px;
    font-size: 16px;
    font-weight: 800;
    display: none;
  }
  .tile .qty-badge.show { display: inline-block; }

  /* ---------- Ticket ---------- */
  .ticket {
    width: 360px;
    flex-shrink: 0;
    min-height: 0;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .ticket h2 { padding: 14px 16px 8px; font-size: 18px; }
  .ticket-items { flex: 1; overflow-y: auto; padding: 0 12px; min-height: 0; }
  .titem {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 10px 4px;
    border-bottom: 1px solid var(--border);
  }
  .trow1 { display: flex; align-items: flex-start; gap: 8px; }
  .trow1 .tname { flex: 1; min-width: 0; font-size: 15px; overflow-wrap: break-word; }
  .trow2 { display: flex; align-items: center; gap: 8px; }
  .trow2 .tunit { color: var(--muted); font-size: 12px; }
  .trow2 .tqty-ctl { display: flex; align-items: center; gap: 6px; }
  .qbtn {
    width: 36px; height: 36px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: var(--panel2);
    color: var(--text);
    font-size: 19px; font-weight: 800;
    cursor: pointer;
    flex-shrink: 0;
  }
  .qbtn:active { background: #d7e8dc; }
  .trow2 .tqty { min-width: 26px; text-align: center; font-weight: 800; font-size: 16px; }
  .trow2 .tsub { margin-left: auto; min-width: 84px; text-align: right; font-weight: 700; font-size: 15px; }
  .trow1 .rm {
    width: 30px; height: 30px;
    border: none; background: none;
    color: var(--danger); font-size: 18px; font-weight: 800;
    cursor: pointer; flex-shrink: 0;
  }
  .empty-ticket { color: var(--muted); text-align: center; padding: 34px 12px; font-size: 15px; }
  .ticket-foot { padding: 12px 16px 16px; border-top: 1px solid var(--border); }
  .total-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
  .total-row .lbl { color: var(--muted); font-size: 16px; font-weight: 700; }
  .total-row .val { font-size: 34px; font-weight: 900; font-variant-numeric: tabular-nums; color: var(--accent); }
  .ticket-btns { display: flex; gap: 10px; }
  .btn-clear {
    padding: 14px 16px;
    border-radius: 12px;
    border: 1px solid #f3c2c2;
    background: #fdecec;
    color: #c62828;
    font-size: 16px; font-weight: 700;
    cursor: pointer;
  }
  .btn-pay {
    flex: 1;
    padding: 14px 16px;
    border-radius: 12px;
    border: none;
    background: var(--pay);
    color: var(--pay-text);
    font-size: 20px; font-weight: 900;
    cursor: pointer;
    min-height: 56px;
  }
  .btn-pay:disabled { background: #d8ded9; color: #8a978d; cursor: not-allowed; }

  /* ---------- Modals ---------- */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(20,40,28,.55);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 50;
  }
  .overlay.show { display: flex; }
  .modal {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 18px;
    width: 100%;
    max-width: 480px;
    max-height: 90vh;
    overflow-y: auto;
    padding: 22px;
  }
  .modal h3 { font-size: 21px; margin-bottom: 14px; color: var(--accent); }
  .modal .big-total { font-size: 38px; font-weight: 900; margin: 6px 0 14px; font-variant-numeric: tabular-nums; }
  .field label { display: block; color: var(--muted); font-weight: 700; font-size: 14px; margin-bottom: 6px; }
  .field input {
    width: 100%;
    font-size: 26px;
    font-weight: 800;
    padding: 12px 14px;
    border-radius: 12px;
    border: 2px solid var(--border);
    background: var(--panel2);
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }
  .field input:focus { outline: none; border-color: var(--accent); }
  .quick { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
  .qchip {
    border: 1px solid var(--border);
    background: var(--panel2);
    color: var(--text);
    font-size: 15px; font-weight: 700;
    padding: 9px 14px;
    border-radius: 999px;
    cursor: pointer;
  }
  .qchip:active { background: #d7e8dc; }
  .change-row {
    display: flex; justify-content: space-between; align-items: baseline;
    margin: 14px 0; padding: 12px 14px;
    background: var(--panel2); border-radius: 12px;
  }
  .change-row .lbl { color: var(--muted); font-weight: 700; }
  .change-row .val { font-size: 28px; font-weight: 900; font-variant-numeric: tabular-nums; color: var(--accent); }
  .change-row.bad .val { color: var(--danger); }
  .modal-btns { display: flex; gap: 10px; margin-top: 16px; }
  .btn-cancel {
    padding: 14px 18px; border-radius: 12px;
    border: 1px solid var(--border); background: var(--panel2);
    color: var(--muted); font-size: 16px; font-weight: 700; cursor: pointer;
  }
  .btn-ok {
    flex: 1; padding: 14px 18px; border-radius: 12px; border: none;
    background: var(--accent); color: #fff;
    font-size: 18px; font-weight: 900; cursor: pointer; min-height: 54px;
  }
  .btn-ok:disabled { background: #d8ded9; color: #8a978d; cursor: not-allowed; }
  .btn-danger {
    padding: 14px 18px; border-radius: 12px; border: none;
    background: var(--danger); color: #fff;
    font-size: 16px; font-weight: 800; cursor: pointer;
  }
  .summary-row { display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 16px; }
  .summary-row b { font-variant-numeric: tabular-nums; }
  .summary-row.total { font-size: 19px; font-weight: 900; border-bottom: none; color: var(--accent); }
  .sale-item { padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
  .sale-item .st { color: var(--muted); font-size: 12px; }
  .sale-item .sa { float: right; font-weight: 800; }
  .note { color: var(--muted); font-size: 14px; margin-top: 10px; line-height: 1.45; }
  .toast {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
    background: #fff; color: #16281c; border: 2px solid var(--accent);
    font-weight: 800; font-size: 16px;
    padding: 13px 22px; border-radius: 999px;
    box-shadow: 0 6px 24px rgba(0,0,0,.5);
    display: none; z-index: 99;
  }
  .toast.show { display: block; }

  /* ---------- Pantallas ---------- */
  .screen { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .screen.hidden { display: none; }
  .sheader {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px;
    background: var(--accent);
    border-bottom: 1px solid var(--accent-d);
  }
  .sheader .stitle { font-size: 20px; font-weight: 800; color: #fff; }
  .back-btn {
    border: 1px solid rgba(255,255,255,.35);
    background: rgba(255,255,255,.12);
    color: #fff;
    font-size: 15px; font-weight: 700;
    padding: 10px 14px; border-radius: 10px;
    cursor: pointer; min-height: 44px;
  }
  .back-btn:hover { background: rgba(255,255,255,.24); }

  /* ---------- Pantalla de inicio ---------- */
  #screenHome { overflow-y: auto; }
  .home-wrap {
    width: 100%; max-width: 520px; margin: auto;
    padding: 28px 18px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .home-logo {
    width: 110px; height: 110px;
    border-radius: 50%; object-fit: cover;
    border: 3px solid var(--accent);
    background: #fff;
    align-self: center;
  }
  .home-title { text-align: center; font-size: 24px; font-weight: 900; color: var(--accent); }
  .home-title span { color: var(--accent-l); }
  .home-caja { text-align: center; color: var(--muted); font-weight: 700; font-size: 15px; }
  .home-btn {
    padding: 18px;
    font-size: 20px; font-weight: 900;
    border-radius: 14px; border: none;
    background: var(--accent); color: #fff;
    cursor: pointer; min-height: 64px;
  }
  .home-btn:active { background: var(--accent-d); }
  .home-btn.amber { background: var(--pay); color: var(--pay-text); }
  .home-btn.small {
    font-size: 16px; min-height: 54px;
    background: var(--panel); color: var(--accent);
    border: 2px solid var(--accent);
  }
  .home-btn.small.open { border-color: var(--accent-l); color: var(--accent-l); }
  .home-row { display: flex; gap: 10px; }
  .home-row .home-btn { flex: 1; }

  /* ---------- Comandas ---------- */
  .comandas-body { flex: 1; overflow-y: auto; padding: 14px; }
  .comandas-body h2 { font-size: 19px; color: var(--accent); margin: 16px 0 10px; }
  .comandas-body h2:first-child { margin-top: 0; }
  .comanda-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px 14px;
    margin-bottom: 12px;
  }
  .comanda-card .c-head { display: flex; justify-content: space-between; align-items: baseline; font-weight: 900; margin-bottom: 8px; }
  .comanda-card .c-time { color: var(--muted); font-weight: 600; font-size: 13px; }
  .comanda-card .c-item { display: flex; justify-content: space-between; font-size: 14px; padding: 3px 0; }
  .comanda-card .c-total { text-align: right; font-weight: 900; font-size: 18px; color: var(--accent); margin: 8px 0; }
  .comanda-card .c-btns { display: flex; gap: 8px; }
  .c-btn { flex: 1; padding: 12px; border-radius: 10px; border: none; font-weight: 800; font-size: 15px; cursor: pointer; }
  .c-btn.deliver { background: var(--panel2); color: var(--accent); border: 1px solid var(--border); }
  .c-btn.pay { background: var(--pay); color: var(--pay-text); }

  /* ---------- Configuración ---------- */
  .config-body { flex: 1; overflow-y: auto; padding: 14px; }
  .config-body h2 { font-size: 19px; color: var(--accent); margin: 16px 0 8px; }
  .config-body h2:first-child { margin-top: 0; }
  .config-body h3 { font-size: 15px; color: var(--muted); margin: 10px 0 6px; }
  .cfg-row {
    display: flex; gap: 8px; align-items: center;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 8px 10px;
    margin-bottom: 8px;
  }
  .cfg-row input[type="text"] {
    flex: 1; min-width: 0;
    font-size: 15px; padding: 9px 10px;
    border-radius: 8px; border: 1px solid var(--border);
    color: var(--text);
  }
  .cfg-row input[type="number"] {
    width: 110px;
    font-size: 15px; padding: 9px 10px;
    border-radius: 8px; border: 1px solid var(--border);
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }
  .config-foot { padding: 12px 14px; border-top: 1px solid var(--border); }
  .btn-save-config {
    width: 100%;
    padding: 16px;
    border-radius: 12px; border: none;
    background: var(--accent); color: #fff;
    font-size: 18px; font-weight: 900;
    cursor: pointer; min-height: 56px;
  }

  /* ---------- Botón Comanda ---------- */
  .btn-comanda {
    flex: 1;
    padding: 14px 10px;
    border-radius: 12px;
    border: none;
    background: var(--accent-l);
    color: #fff;
    font-size: 16px; font-weight: 800;
    cursor: pointer;
    min-height: 56px;
  }
  .btn-comanda:disabled { background: #d8ded9; color: #8a978d; cursor: not-allowed; }

  @media (max-width: 900px) {
    main { flex-direction: column; }
    .ticket { width: 100%; flex: 1; min-height: 0; }
    .sec-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  }
</style>
</head>
<body>

<section id="screenHome" class="screen">
  <div class="home-wrap">
    <img class="home-logo" id="homeLogo" alt="Taquería El Vergel">
    <div class="home-title">Punto de venta - Taquería <span>"El Vergel"</span></div>
    <div class="home-caja" id="homeCajaState">Caja cerrada</div>
    <button class="home-btn amber" id="btnHomePos">Punto de venta</button>
    <button class="home-btn" id="btnHomeComandas">Comandas <span id="homeComandasCount"></span></button>
    <button class="home-btn" id="btnHomeConfig">Configuración</button>
    <div class="home-row">
      <button class="home-btn small" id="btnApertura">Apertura de caja</button>
      <button class="home-btn small" id="btnCorte">Corte de caja</button>
    </div>
  </div>
</section>

<script>
/* ================= Catálogo (edita aquí precios y productos) ================= */
const CATALOG_DEFAULTS = [
  { id: 'tacos', label: 'Tacos', sections: [
    { id: 'ordenes', label: 'Órdenes', items: [
      { id: 'suadero',    name: 'Orden de suadero',    price: 130, color: '#1e5631' },
      { id: 'cuero',      name: 'Orden de cuero',      price: 130, color: '#276749' },
      { id: 'adobada',    name: 'Orden de adobada',    price: 130, color: '#2f855a' },
      { id: 'campechano', name: 'Orden de campechano', price: 130, color: '#38a169' },
    ]},
    { id: 'individual', label: 'Taco individual', items: [
      { id: 'suadero-ind',    name: 'Taco de suadero',    price: 32.50, color: '#1e5631' },
      { id: 'cuero-ind',      name: 'Taco de cuero',      price: 32.50, color: '#276749' },
      { id: 'adobada-ind',    name: 'Taco de adobada',    price: 32.50, color: '#2f855a' },
      { id: 'campechano-ind', name: 'Taco de campechano', price: 32.50, color: '#38a169' },
    ]},
  ]},
  { id: 'bebidas', label: 'Bebidas', sections: [
    { id: 'refrescos', label: 'Refrescos', items: [
      { id: 'coca',   name: 'Coca Cola', price: 30, color: '#2d7d46' },
      { id: 'sprite', name: 'Sprite',    price: 30, color: '#43a047' },
      { id: 'fanta',  name: 'Fanta',     price: 30, color: '#558b2f' },
    ]},
    { id: 'aguas', label: 'Aguas', items: [
      { id: 'jamaica',  name: 'Agua de Jamaica', price: 30, color: '#1b5e20' },
      { id: 'limon',    name: 'Agua de limón',   price: 30, color: '#33691e' },
      { id: 'horchata', name: 'Agua de horchata', price: 30, color: '#2e7d32' },
    ]},
  ]},
  { id: 'otros', label: 'Otros', sections: [
    { id: 'otros', label: null, items: [
      { id: 'dulce', name: 'Dulce', price: 2, color: '#558b2f' },
    ]},
  ]},
];

/* ================= Estado ================= */
const LS_SALES   = 'pvtaqueria_sales';
const LS_SESSION = 'pvtaqueria_session';
const LS_CORTES  = 'pvtaqueria_cortes';
const LS_LASTCUT = 'pvtaqueria_lastCorteIndex';
const LS_COMANDAS = 'pvtaqueria_comandas';
const LS_COMANDA_SEQ = 'pvtaqueria_comandaSeq';
const LS_CATALOG = 'pvtaqueria_catalog';

let catalog = load(LS_CATALOG, null);
if (!catalog) catalog = JSON.parse(JSON.stringify(CATALOG_DEFAULTS));

let ticket = {};              // productId -> qty
let activeCat = catalog[0].id;
let comandas = load(LS_COMANDAS, []);
let comandaSeq = load(LS_COMANDA_SEQ, 0);
let sales = load(LS_SALES, []);
let session = load(LS_SESSION, null);            // { opening, startISO, salesStartIndex }
let cortes = load(LS_CORTES, []);                // closed sessions summaries
let lastCorteIndex = load(LS_LASTCUT, 0);        // sales index since last corte (when no session)

function load(key, fallback) {
  try { const v = JSON.parse(localStorage.getItem(key)); return v == null ? fallback : v; }
  catch (e) { return fallback; }
}
function save(key, val) { localStorage.setItem(key, JSON.stringify(val)); }

function productById(id) {
  for (const cat of catalog) for (const sec of cat.sections) for (const p of sec.items) if (p.id === id) return p;
  return null;
}
function fmt(n) {
  return '$' + Number(n).toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function nowISO() { return new Date().toISOString(); }
function fmtDateTime(iso) {
  const d = new Date(iso);
  return d.toLocaleString('es-MX', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}

/* ================= Reloj ================= */
function tickClock() {
  document.getElementById('clock').textContent =
    new Date().toLocaleString('es-MX', { weekday: 'short', day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit', second: '2-digit' });
}
setInterval(tickClock, 1000); tickClock();

/* ================= Toast ================= */
let toastTimer = null;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ================= Modales ================= */
function showOv(id) { document.getElementById(id).classList.add('show'); }
function hideOv(id) { document.getElementById(id).classList.remove('show'); }
document.querySelectorAll('[data-close]').forEach(b =>
  b.addEventListener('click', () => hideOv(b.dataset.close)));
document.querySelectorAll('.overlay').forEach(ov =>
  ov.addEventListener('click', e => { if (e.target === ov) ov.classList.remove('show'); }));

/* ================= Catálogo / grid ================= */
function renderTabs() {
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = '';
  catalog.forEach(cat => {
    const b = document.createElement('button');
    b.className = 'tab' + (cat.id === activeCat ? ' active' : '');
    b.textContent = cat.label;
    b.addEventListener('click', () => { activeCat = cat.id; renderTabs(); renderGrid(); });
    tabs.appendChild(b);
  });
}
function makeTile(p) {
  const b = document.createElement('button');
  b.className = 'tile';
  b.style.background = p.color;
  const qty = ticket[p.id] || 0;
  b.innerHTML = '<span class="price">' + fmt(p.price) + '</span>' +
                '<span class="name">' + p.name + '</span>' +
                '<span class="qty-badge' + (qty > 0 ? ' show' : '') + '">x' + qty + '</span>';
  b.addEventListener('click', () => addToTicket(p.id));
  return b;
}
function renderGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  const cat = catalog.find(c => c.id === activeCat);
  cat.sections.forEach(sec => {
    if (sec.label) {
      const h = document.createElement('div');
      h.className = 'sec-title';
      h.textContent = sec.label;
      grid.appendChild(h);
    }
    const g = document.createElement('div');
    g.className = 'sec-grid';
    if (!sec.items.length) {
      const e = document.createElement('div');
      e.className = 'empty-state';
      e.textContent = 'Sin productos por ahora';
      g.appendChild(e);
    }
    sec.items.forEach(p => g.appendChild(makeTile(p)));
    grid.appendChild(g);
  });
}

/* ================= Ticket ================= */
function ticketTotal() {
  let total = 0;
  for (const id in ticket) {
    const p = productById(id);
    if (p) total += p.price * ticket[id];
  }
  return total;
}
function renderTicket() {
  const box = document.getElementById('ticketItems');
  const ids = Object.keys(ticket).filter(id => ticket[id] > 0);
  if (!ids.length) {
    box.innerHTML = '<div class="empty-ticket">Toca un producto para agregarlo al ticket.</div>';
  } else {
    box.innerHTML = '';
    ids.forEach(id => {
      const p = productById(id);
      const row = document.createElement('div');
      row.className = 'titem';
      row.innerHTML =
        '<div class="trow1"><b class="tname">' + p.name + '</b>' +
        '<button class="rm" data-act="rm">×</button></div>' +
        '<div class="trow2">' +
        '<span class="tunit">' + fmt(p.price) + ' c/u</span>' +
        '<span class="tqty-ctl">' +
        '<button class="qbtn" data-act="dec">−</button>' +
        '<span class="tqty">' + ticket[id] + '</span>' +
        '<button class="qbtn" data-act="inc">+</button>' +
        '</span>' +
        '<span class="tsub">' + fmt(p.price * ticket[id]) + '</span>' +
        '</div>';
      row.querySelector('[data-act="dec"]').addEventListener('click', () => changeQty(id, -1));
      row.querySelector('[data-act="inc"]').addEventListener('click', () => changeQty(id, 1));
      row.querySelector('[data-act="rm"]').addEventListener('click', () => { delete ticket[id]; refreshAll(); });
      box.appendChild(row);
    });
  }
  const total = ticketTotal();
  document.getElementById('totalVal').textContent = fmt(total);
  document.getElementById('btnCobrar').disabled = total <= 0;
  document.getElementById('btnComanda').disabled = total <= 0;
}
function refreshAll() { renderGrid(); renderTicket(); }
function addToTicket(id) { ticket[id] = (ticket[id] || 0) + 1; refreshAll(); }
function changeQty(id, delta) {
  ticket[id] = (ticket[id] || 0) + delta;
  if (ticket[id] <= 0) delete ticket[id];
  refreshAll();
}
document.getElementById('btnVaciar').addEventListener('click', () => {
  if (!Object.keys(ticket).length) return;
  ticket = {}; refreshAll();
});
document.getElementById('btnComanda').addEventListener('click', () => {
  const ids = Object.keys(ticket).filter(id => ticket[id] > 0);
  if (!ids.length) return;
  const items = ids.map(id => {
    const p = productById(id);
    return { id: p.id, name: p.name, price: p.price, qty: ticket[id], subtotal: p.price * ticket[id] };
  });
  comandaSeq += 1;
  comandas.push({ id: comandaSeq, datetime: nowISO(), items: items, total: ticketTotal(), status: 'activa' });
  save(LS_COMANDAS, comandas);
  save(LS_COMANDA_SEQ, comandaSeq);
  ticket = {}; refreshAll();
  updateHomeComandas();
  toast('Comanda #' + comandaSeq + ' creada');
});

/* ================= Cobrar ================= */
const inpRecibido = document.getElementById('inpRecibido');
let payCtx = null; // { kind:'ticket', total } | { kind:'comanda', comanda, total }
function payTotal() { return payCtx ? payCtx.total : 0; }
function openCobrar() {
  const total = ticketTotal();
  if (total <= 0) return;
  payCtx = { kind: 'ticket', total: total };
  document.getElementById('cobrarTitle').textContent = 'Cobrar';
  document.getElementById('cobrarTotal').textContent = fmt(total);
  inpRecibido.value = '';
  renderQuickChips(total);
  updateCambio();
  showOv('ovCobrar');
  setTimeout(() => inpRecibido.focus(), 60);
}
function openComandaPay(comanda) {
  payCtx = { kind: 'comanda', comanda: comanda, total: comanda.total };
  document.getElementById('cobrarTitle').textContent = 'Cobrar comanda #' + comanda.id;
  document.getElementById('cobrarTotal').textContent = fmt(comanda.total);
  inpRecibido.value = '';
  renderQuickChips(comanda.total);
  updateCambio();
  showOv('ovCobrar');
  setTimeout(() => inpRecibido.focus(), 60);
}
function renderQuickChips(total) {
  const box = document.getElementById('quickChips');
  box.innerHTML = '';
  const opts = [];
  opts.push({ label: 'Exacto', val: total });
  const rounds = [50, 100, 200, 500, 1000];
  rounds.forEach(r => { if (r > total) opts.push({ label: fmt(r), val: r }); });
  opts.forEach(o => {
    const b = document.createElement('button');
    b.className = 'qchip';
    b.textContent = o.label;
    b.addEventListener('click', () => { inpRecibido.value = o.val.toFixed(2); updateCambio(); });
    box.appendChild(b);
  });
}
function updateCambio() {
  const total = payTotal();
  const rec = parseFloat(inpRecibido.value) || 0;
  const cambio = rec - total;
  const row = document.getElementById('changeRow');
  document.getElementById('cambioVal').textContent = fmt(Math.abs(cambio));
  row.classList.toggle('bad', cambio < 0);
  document.getElementById('btnConfirmarCobro').disabled = rec < total;
}
inpRecibido.addEventListener('input', updateCambio);

document.getElementById('btnCobrar').addEventListener('click', openCobrar);
document.getElementById('btnConfirmarCobro').addEventListener('click', () => {
  if (!payCtx) return;
  const total = payCtx.total;
  const rec = parseFloat(inpRecibido.value) || 0;
  if (rec < total) return;
  let items;
  if (payCtx.kind === 'comanda') {
    items = payCtx.comanda.items.map(i => ({ id: i.id, name: i.name, price: i.price, qty: i.qty, subtotal: i.subtotal }));
    comandas = comandas.filter(c => c.id !== payCtx.comanda.id);
    save(LS_COMANDAS, comandas);
  } else {
    items = Object.keys(ticket).filter(id => ticket[id] > 0).map(id => {
      const p = productById(id);
      return { id: p.id, name: p.name, price: p.price, qty: ticket[id], subtotal: p.price * ticket[id] };
    });
    ticket = {};
  }
  sales.push({
    id: Date.now(),
    datetime: nowISO(),
    items: items,
    total: total,
    received: rec,
    change: rec - total,
    sessionOpen: !!session
  });
  save(LS_SALES, sales);
  refreshAll();
  renderComandas();
  updateHomeComandas();
  hideOv('ovCobrar');
  toast('Venta registrada. Cambio: ' + fmt(rec - total));
});

/* ================= Apertura / Corte ================= */
function refreshSessionBtns() {
  const b = document.getElementById('btnApertura');
  b.classList.toggle('open', !!session);
  b.textContent = session ? 'Caja abierta' : 'Apertura de caja';
  document.getElementById('homeCajaState').textContent = session ? 'Caja abierta' : 'Caja cerrada';
}
document.getElementById('btnApertura').addEventListener('click', () => {
  if (session) {
    document.getElementById('aperturaForm').style.display = 'none';
    document.getElementById('aperturaAbierta').style.display = 'block';
    document.getElementById('aperturaDesde').textContent = fmtDateTime(session.startISO);
    document.getElementById('aperturaFondoLbl').textContent = fmt(session.opening);
  } else {
    document.getElementById('aperturaForm').style.display = 'block';
    document.getElementById('aperturaAbierta').style.display = 'none';
    document.getElementById('inpFondo').value = '';
  }
  showOv('ovApertura');
});
document.getElementById('btnIniciarCaja').addEventListener('click', () => {
  const fondo = parseFloat(document.getElementById('inpFondo').value) || 0;
  session = { opening: fondo, startISO: nowISO(), salesStartIndex: sales.length };
  save(LS_SESSION, session);
  refreshSessionBtns();
  hideOv('ovApertura');
  toast('Caja abierta con fondo de ' + fmt(fondo));
});
document.getElementById('btnIrCorte').addEventListener('click', () => {
  hideOv('ovApertura'); openCorte();
});

function sessionSales() {
  if (session) return sales.slice(session.salesStartIndex);
  return sales.slice(lastCorteIndex);
}
function openCorte() {
  const list = sessionSales();
  const totalSold = list.reduce((s, v) => s + v.total, 0);
  const opening = session ? session.opening : 0;
  const body = document.getElementById('corteBody');
  let html = '';
  html += '<div class="summary-row"><span>Fondo inicial</span><b>' + fmt(opening) + '</b></div>';
  html += '<div class="summary-row"><span>Ventas</span><b>' + list.length + '</b></div>';
  html += '<div class="summary-row"><span>Total vendido</span><b>' + fmt(totalSold) + '</b></div>';
  html += '<div class="summary-row total"><span>Efectivo esperado</span><b>' + fmt(opening + totalSold) + '</b></div>';
  if (!session) html += '<div class="note">Sin caja abierta: se resumen las ventas desde el último corte.</div>';
  if (list.length) {
    html += '<h3 style="font-size:16px;margin:16px 0 6px">Ventas del periodo</h3>';
    list.forEach(v => {
      const itemsTxt = v.items.map(i => i.qty + '× ' + i.name).join(', ');
      html += '<div class="sale-item"><span class="sa">' + fmt(v.total) + '</span>' +
              '<span class="st">' + fmtDateTime(v.datetime) + '</span><br>' + itemsTxt + '</div>';
    });
  } else {
    html += '<div class="note">No hay ventas en este periodo.</div>';
  }
  body.innerHTML = html;
  document.getElementById('btnCerrarCaja').style.display = (list.length || session) ? 'block' : 'none';
  showOv('ovCorte');
}
document.getElementById('btnCorte').addEventListener('click', openCorte);
document.getElementById('btnCerrarCaja').addEventListener('click', () => {
  const list = sessionSales();
  const totalSold = list.reduce((s, v) => s + v.total, 0);
  cortes.push({
    closedAt: nowISO(),
    opening: session ? session.opening : 0,
    startISO: session ? session.startISO : (list.length ? list[0].datetime : null),
    salesCount: list.length,
    totalSold: totalSold,
    expectedCash: (session ? session.opening : 0) + totalSold
  });
  save(LS_CORTES, cortes);
  lastCorteIndex = sales.length;
  save(LS_LASTCUT, lastCorteIndex);
  session = null;
  save(LS_SESSION, null);
  refreshSessionBtns();
  hideOv('ovCorte');
  toast('Corte de caja registrado: ' + fmt(totalSold) + ' vendidos');
});

/* ================= Historial ================= */
document.getElementById('btnHistorial').addEventListener('click', () => {
  const body = document.getElementById('historialBody');
  if (!sales.length) {
    body.innerHTML = '<div class="note">Todavía no hay ventas registradas.</div>';
  } else {
    let html = '';
    [...sales].reverse().forEach(v => {
      const itemsTxt = v.items.map(i => i.qty + '× ' + i.name).join(', ');
      html += '<div class="sale-item"><span class="sa">' + fmt(v.total) + '</span>' +
              '<span class="st">' + fmtDateTime(v.datetime) + (v.sessionOpen ? '' : ' · sin sesión') + '</span><br>' +
              itemsTxt + '<br><span class="st">Recibido ' + fmt(v.received) + ' · Cambio ' + fmt(v.change) + '</span></div>';
    });
    body.innerHTML = html;
  }
  showOv('ovHistorial');
});
document.getElementById('btnLimpiarHistorial').addEventListener('click', () => {
  if (!sales.length) return;
  if (!confirm('¿Borrar todo el historial de ventas? Esta acción no se puede deshacer.')) return;
  sales = [];
  save(LS_SALES, sales);
  document.getElementById('historialBody').innerHTML = '<div class="note">Historial borrado.</div>';
  toast('Historial borrado');
});

/* ================= Navegación entre pantallas ================= */
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('hidden', s.id !== id));
  if (id === 'screenComandas') renderComandas();
  if (id === 'screenConfig') renderConfig();
  if (id === 'screenHome') { updateHomeComandas(); refreshSessionBtns(); }
}
document.getElementById('btnHomePos').addEventListener('click', () => showScreen('screenPos'));
document.getElementById('btnHomeComandas').addEventListener('click', () => showScreen('screenComandas'));
document.getElementById('btnHomeConfig').addEventListener('click', () => showScreen('screenConfig'));
document.getElementById('btnBackPos').addEventListener('click', () => showScreen('screenHome'));
document.getElementById('btnBackComandas').addEventListener('click', () => showScreen('screenHome'));
document.getElementById('btnBackConfig').addEventListener('click', () => showScreen('screenHome'));

/* Logo del inicio (copia el del encabezado) */
(function () {
  const src = document.querySelector('header .logo');
  const home = document.getElementById('homeLogo');
  if (src && home) home.src = src.src;
})();

/* ================= Comandas ================= */
function updateHomeComandas() {
  const n = comandas.filter(c => c.status === 'activa').length;
  document.getElementById('homeComandasCount').textContent = n ? '(' + n + ' activa' + (n > 1 ? 's' : '') + ')' : '';
}
function comandaCard(c, isActiva) {
  const card = document.createElement('div');
  card.className = 'comanda-card';
  let itemsHtml = c.items.map(i => '<div class="c-item"><span>' + i.qty + '× ' + i.name + '</span><span>' + fmt(i.subtotal) + '</span></div>').join('');
  card.innerHTML = '<div class="c-head"><span>Comanda #' + c.id + '</span><span class="c-time">' + fmtDateTime(c.datetime) + '</span></div>' +
    itemsHtml + '<div class="c-total">' + fmt(c.total) + '</div>';
  const btns = document.createElement('div');
  btns.className = 'c-btns';
  if (isActiva) {
    const bEnt = document.createElement('button');
    bEnt.className = 'c-btn deliver';
    bEnt.textContent = 'Entregada';
    bEnt.addEventListener('click', () => {
      c.status = 'completada';
      save(LS_COMANDAS, comandas);
      renderComandas(); updateHomeComandas();
      toast('Comanda #' + c.id + ' entregada');
    });
    btns.appendChild(bEnt);
  }
  const bPay = document.createElement('button');
  bPay.className = 'c-btn pay';
  bPay.textContent = 'Pagada';
  bPay.addEventListener('click', () => openComandaPay(c));
  btns.appendChild(bPay);
  card.appendChild(btns);
  return card;
}
function renderComandas() {
  const actBox = document.getElementById('comandasActivas');
  const compBox = document.getElementById('comandasCompletadas');
  const act = comandas.filter(c => c.status === 'activa');
  const comp = comandas.filter(c => c.status === 'completada');
  actBox.innerHTML = act.length ? '' : '<div class="empty-state">No hay comandas activas</div>';
  compBox.innerHTML = comp.length ? '' : '<div class="empty-state">No hay comandas completadas</div>';
  act.forEach(c => actBox.appendChild(comandaCard(c, true)));
  comp.forEach(c => compBox.appendChild(comandaCard(c, false)));
}

/* ================= Configuración ================= */
function renderConfig() {
  const body = document.getElementById('configBody');
  body.innerHTML = '';
  catalog.forEach(cat => {
    const h = document.createElement('h2');
    h.textContent = cat.label;
    body.appendChild(h);
    cat.sections.forEach(sec => {
      if (sec.label) {
        const h3 = document.createElement('h3');
        h3.textContent = sec.label;
        body.appendChild(h3);
      }
      sec.items.forEach(p => {
        const row = document.createElement('div');
        row.className = 'cfg-row';
        const nameIn = document.createElement('input');
        nameIn.type = 'text';
        nameIn.value = p.name;
        nameIn.dataset.pid = p.id;
        nameIn.dataset.field = 'name';
        const priceIn = document.createElement('input');
        priceIn.type = 'number';
        priceIn.min = '0';
        priceIn.step = '0.01';
        priceIn.value = p.price;
        priceIn.dataset.pid = p.id;
        priceIn.dataset.field = 'price';
        row.appendChild(nameIn);
        row.appendChild(priceIn);
        body.appendChild(row);
      });
    });
  });
}
document.getElementById('btnGuardarConfig').addEventListener('click', () => {
  const next = JSON.parse(JSON.stringify(catalog));
  document.querySelectorAll('#configBody input').forEach(inp => {
    const pid = inp.dataset.pid, field = inp.dataset.field;
    for (const cat of next) for (const sec of cat.sections) for (const p of sec.items) {
      if (p.id !== pid) continue;
      if (field === 'name') { const v = inp.value.trim(); if (v) p.name = v; }
      else { const v = parseFloat(inp.value); if (!isNaN(v) && v >= 0) p.price = v; }
    }
  });
  catalog = next;
  save(LS_CATALOG, catalog);
  if (!catalog.find(c => c.id === activeCat)) activeCat = catalog[0].id;
  renderTabs(); renderGrid(); renderTicket();
  toast('Configuración guardada');
});

/* ================= Init ================= */
renderTabs();
renderGrid();
renderTicket();
refreshSessionBtns();
updateHomeComandas();
showScreen('screenHome');
</script>
</body>
